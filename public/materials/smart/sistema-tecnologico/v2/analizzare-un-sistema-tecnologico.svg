<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="white"/><text x="60" y="80" font-family="Arial" font-size="42" font-weight="700">ANALIZZARE UN SISTEMA TECNOLOGICO</text><text x="60" y="125" font-family="Arial" font-size="24">Sei domande per rendere visibile il funzionamento</text><g font-family="Arial" font-size="24"><rect x="60" y="180" width="330" height="150" fill="none" stroke="black" stroke-width="3"/><text x="85" y="225" font-weight="700">1 · SCOPO</text><text x="85" y="270">A quale bisogno risponde?</text><rect x="435" y="180" width="330" height="150" fill="none" stroke="black" stroke-width="3"/><text x="460" y="225" font-weight="700">2 · INGRESSI</text><text x="460" y="270">Energia · materiali · dati</text><rect x="810" y="180" width="330" height="150" fill="none" stroke="black" stroke-width="3"/><text x="835" y="225" font-weight="700">3 · PROCESSO</text><text x="835" y="270">Che cosa accade?</text><rect x="60" y="375" width="330" height="150" fill="none" stroke="black" stroke-width="3"/><text x="85" y="420" font-weight="700">4 · USCITE</text><text x="85" y="465">Prodotto · servizio · scarto</text><rect x="435" y="375" width="330" height="150" fill="none" stroke="black" stroke-width="3"/><text x="460" y="420" font-weight="700">5 · CONTROLLO</text><text x="460" y="465">Chi o che cosa regola?</text><rect x="810" y="375" width="330" height="150" fill="none" stroke="black" stroke-width="3"/><text x="835" y="420" font-weight="700">6 · IMPATTI</text><text x="835" y="465">Benefici · consumi · ambiente</text></g><text x="60" y="610" font-family="Arial" font-size="26" font-weight="700">Non basta nominare le parti: cerca le RELAZIONI.</text></svg>