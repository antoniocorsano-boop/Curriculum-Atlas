<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="white"/><text x="60" y="80" font-family="Arial" font-size="42" font-weight="700">LO SMARTPHONE COME SISTEMA TECNOLOGICO</text><g font-family="Arial" font-size="23"><text x="70" y="165" font-weight="700">INGRESSI</text><text x="70" y="205">energia · tocchi · voce · dati · sensori</text><text x="70" y="290" font-weight="700">PROCESSO</text><text x="70" y="330">hardware + software elaborano e coordinano informazioni</text><text x="70" y="415" font-weight="700">USCITE</text><text x="70" y="455">immagini · suoni · vibrazioni · dati trasmessi</text><text x="670" y="165" font-weight="700">CONTROLLO</text><text x="670" y="205">sistema operativo · app · sensori · utente</text><text x="670" y="290" font-weight="700">IMPATTI</text><text x="670" y="330">servizi e comunicazione · energia · risorse · rifiuti elettronici</text><text x="670" y="415" font-weight="700">DOMANDA</text><text x="670" y="455">Se cambia una parte, che cosa cambia nel sistema?</text></g><rect x="50" y="120" width="1100" height="400" fill="none" stroke="black" stroke-width="3"/><text x="60" y="600" font-family="Arial" font-size="26" font-weight="700">Leggi il sistema: SCOPO → INGRESSI → PROCESSO → USCITE → CONTROLLO → IMPATTI</text></svg>