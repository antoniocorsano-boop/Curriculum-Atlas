<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414" role="img" aria-labelledby="title desc"><title id="title">Scheda studente: dal bisogno alla soluzione tecnica</title><desc id="desc">Scheda operativa stampabile per la classe 1C.</desc><rect width="100%" height="100%" fill="#f8fbff"/><rect x="35" y="25" width="930" height="125" rx="24" fill="#dbeafe" stroke="#bfdbfe" stroke-width="3"/><text x="500" y="72" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#0f2f66" text-anchor="middle">SCHEDA STUDENTE</text><text x="500" y="118" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0f2f66" text-anchor="middle">DAL BISOGNO ALLA SOLUZIONE TECNICA</text><text x="500" y="172" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#334155" text-anchor="middle">Tecnologia · Classe 1C</text><text x="70" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#0f172a" text-anchor="start">Nome e cognome: ______________________________</text><text x="650" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#0f172a" text-anchor="start">Classe: ____   Data: ____</text><text x="70" y="285" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#14532d" text-anchor="start">1. Completa la tabella</text><line x1="45" y1="320" x2="45" y2="812" stroke="#64748b" stroke-width="2"/><line x1="250" y1="320" x2="250" y2="812" stroke="#64748b" stroke-width="2"/><line x1="500" y1="320" x2="500" y2="812" stroke="#64748b" stroke-width="2"/><line x1="720" y1="320" x2="720" y2="812" stroke="#64748b" stroke-width="2"/><line x1="955" y1="320" x2="955" y2="812" stroke="#64748b" stroke-width="2"/><line x1="45" y1="320" x2="955" y2="320" stroke="#64748b" stroke-width="2"/><line x1="45" y1="402" x2="955" y2="402" stroke="#64748b" stroke-width="2"/><line x1="45" y1="484" x2="955" y2="484" stroke="#64748b" stroke-width="2"/><line x1="45" y1="566" x2="955" y2="566" stroke="#64748b" stroke-width="2"/><line x1="45" y1="648" x2="955" y2="648" stroke="#64748b" stroke-width="2"/><line x1="45" y1="730" x2="955" y2="730" stroke="#64748b" stroke-width="2"/><line x1="45" y1="812" x2="955" y2="812" stroke="#64748b" stroke-width="2"/><rect x="45" y="320" width="205" height="82" rx="0" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><rect x="250" y="320" width="250" height="82" rx="0" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><rect x="500" y="320" width="220" height="82" rx="0" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><rect x="720" y="320" width="235" height="82" rx="0" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text x="147" y="370" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#0f2f66" text-anchor="middle">Bisogno</text><text x="375" y="370" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#0f2f66" text-anchor="middle">Problema da risolvere</text><text x="610" y="370" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#0f2f66" text-anchor="middle">Bene o servizio</text><text x="837" y="370" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#0f2f66" text-anchor="middle">Esempio di soluzione</text><text x="65" y="452" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Bere</text><text x="65" y="534" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Spostarsi</text><text x="65" y="616" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Comunicare</text><text x="65" y="698" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Studiare</text><text x="65" y="780" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Proteggersi dal freddo</text><text x="70" y="860" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#166534" text-anchor="start">2. Scegli un bisogno e rappresentalo</text><text x="70" y="900" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#334155" text-anchor="start">Scrivi e disegna:  BISOGNO → SOLUZIONE</text><rect x="55" y="930" width="890" height="270" rx="18" fill="#ffffff" stroke="#4ade80" stroke-width="3"/><text x="70" y="1260" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#1d4ed8" text-anchor="start">3. Oggi ho capito che...</text><text x="85" y="1302" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">La tecnologia nasce anche per rispondere ai ____________________.</text><text x="85" y="1326" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">Un oggetto materiale è un ____________________.</text><text x="85" y="1350" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">Un'attività organizzata che risponde a un bisogno è un ____________________.</text><text x="85" y="1374" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">Uno stesso bisogno può essere soddisfatto con ____________________ soluzioni.</text><text x="85" y="1398" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#0f172a" text-anchor="start">Le soluzioni tecniche possono cambiare nel ____________________.</text></svg>