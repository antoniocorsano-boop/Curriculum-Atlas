<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1414" viewBox="0 0 1000 1414" role="img" aria-labelledby="title desc"><title id="title">Scheda studente: dove va l'energia?</title><desc id="desc">Scheda operativa stampabile per la classe 3E.</desc><rect width="100%" height="100%" fill="#f8fbff"/><rect x="35" y="25" width="930" height="125" rx="24" fill="#dbeafe" stroke="#bfdbfe" stroke-width="3"/><text x="500" y="72" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#0f2f66" text-anchor="middle">SCHEDA STUDENTE</text><text x="500" y="118" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#0f2f66" text-anchor="middle">DOVE VA L'ENERGIA?</text><text x="500" y="172" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#334155" text-anchor="middle">Tecnologia · Classe 3E</text><text x="70" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#0f172a" text-anchor="start">Nome e cognome: ______________________________</text><text x="650" y="220" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#0f172a" text-anchor="start">Classe: ____   Data: ____</text><text x="70" y="285" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#14532d" text-anchor="start">1. Completa la tabella</text><line x1="35" y1="320" x2="35" y2="710" stroke="#64748b" stroke-width="2"/><line x1="210" y1="320" x2="210" y2="710" stroke="#64748b" stroke-width="2"/><line x1="390" y1="320" x2="390" y2="710" stroke="#64748b" stroke-width="2"/><line x1="570" y1="320" x2="570" y2="710" stroke="#64748b" stroke-width="2"/><line x1="745" y1="320" x2="745" y2="710" stroke="#64748b" stroke-width="2"/><line x1="965" y1="320" x2="965" y2="710" stroke="#64748b" stroke-width="2"/><line x1="35" y1="320" x2="965" y2="320" stroke="#64748b" stroke-width="2"/><line x1="35" y1="398" x2="965" y2="398" stroke="#64748b" stroke-width="2"/><line x1="35" y1="476" x2="965" y2="476" stroke="#64748b" stroke-width="2"/><line x1="35" y1="554" x2="965" y2="554" stroke="#64748b" stroke-width="2"/><line x1="35" y1="632" x2="965" y2="632" stroke="#64748b" stroke-width="2"/><line x1="35" y1="710" x2="965" y2="710" stroke="#64748b" stroke-width="2"/><rect x="35" y="320" width="175" height="78" rx="0" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><rect x="210" y="320" width="180" height="78" rx="0" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><rect x="390" y="320" width="180" height="78" rx="0" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><rect x="570" y="320" width="175" height="78" rx="0" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><rect x="745" y="320" width="220" height="78" rx="0" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/><text x="122" y="366" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#0f2f66" text-anchor="middle">Sistema</text><text x="300" y="355" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#0f2f66" text-anchor="middle">Energia in</text><text x="300" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#0f2f66" text-anchor="middle">entrata</text><text x="480" y="366" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#0f2f66" text-anchor="middle">Trasformazione</text><text x="657" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#0f2f66" text-anchor="middle">Effetto utile</text><text x="855" y="355" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#0f2f66" text-anchor="middle">Altri effetti /</text><text x="855" y="378" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#0f2f66" text-anchor="middle">dispersioni</text><text x="52" y="446" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Lampada</text><text x="52" y="524" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Automobile</text><text x="52" y="602" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Asciugacapelli</text><text x="52" y="680" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Televisore</text><text x="70" y="760" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#92400e" text-anchor="start">2. Rappresenta un sistema</text><text x="70" y="800" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#334155" text-anchor="start">INPUT → TRASFORMAZIONE → OUTPUT UTILE + DISPERSIONI</text><rect x="55" y="825" width="890" height="270" rx="18" fill="#ffffff" stroke="#fbbf24" stroke-width="3"/><text x="70" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#b91c1c" text-anchor="start">3. Confronta</text><text x="70" y="1185" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#0f172a" text-anchor="start">Lampada A: molta luce, poco calore.   Lampada B: stessa luce, molto calore.</text><text x="70" y="1215" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a" text-anchor="start">Quale utilizza meglio l'energia? Perché?</text><line x1="70" y1="1248" x2="470" y2="1248" stroke="#64748b" stroke-width="2"/><line x1="70" y1="1280" x2="470" y2="1280" stroke="#64748b" stroke-width="2"/><line x1="70" y1="1312" x2="470" y2="1312" stroke="#64748b" stroke-width="2"/><text x="530" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#166534" text-anchor="start">4. Completa</text><text x="530" y="1188" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="start">Un sistema riceve energia, la ______ e produce degli ______.</text><text x="530" y="1234" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="start">L'effetto desiderato si chiama effetto ______.</text><text x="530" y="1280" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="start">Gli effetti non desiderati sono chiamati ______.</text><text x="530" y="1326" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="500" fill="#0f172a" text-anchor="start">È più efficiente chi usa meglio l'energia per il risultato ______.</text></svg>