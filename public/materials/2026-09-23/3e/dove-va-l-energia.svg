<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Dove va l'energia?</title><desc id="desc">Infografica di Tecnologia per la classe 3E.</desc><rect width="100%" height="100%" fill="#f8fbff"/><text x="800" y="70" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#0f2f66" text-anchor="middle">DOVE VA L'ENERGIA?</text><text x="800" y="118" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#334155" text-anchor="middle">Tecnologia · Classe 3E</text><rect x="45" y="160" width="430" height="160" rx="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/><text x="260" y="256" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">ENERGIA IN ENTRATA</text><rect x="585" y="160" width="430" height="160" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="800" y="256" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">TRASFORMAZIONE</text><rect x="1125" y="160" width="430" height="160" rx="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text x="1340" y="256" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">EFFETTO UTILE + DISPERSIONI</text><line x1="475" y1="240" x2="585" y2="240" stroke="#f97316" stroke-width="10"/><polygon points="585,240 561,224 561,256" fill="#f97316"/><line x1="1015" y1="240" x2="1125" y2="240" stroke="#22c55e" stroke-width="10"/><polygon points="1125,240 1101,224 1101,256" fill="#22c55e"/><rect x="45" y="370" width="470" height="230" rx="24" fill="#fff1f2" stroke="#cbd5e1" stroke-width="3"/><text x="280" y="425" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#0f2f66" text-anchor="middle">Lampada</text><text x="280" y="490" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#334155" text-anchor="middle">energia elettrica → lampada</text><text x="280" y="548" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">luce + calore</text><rect x="565" y="370" width="470" height="230" rx="24" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="3"/><text x="800" y="425" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#0f2f66" text-anchor="middle">Automobile</text><text x="800" y="490" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#334155" text-anchor="middle">energia chimica → motore</text><text x="800" y="548" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">movimento + calore + rumore</text><rect x="1085" y="370" width="470" height="230" rx="24" fill="#eff6ff" stroke="#cbd5e1" stroke-width="3"/><text x="1320" y="425" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#0f2f66" text-anchor="middle">Asciugacapelli</text><text x="1320" y="490" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#334155" text-anchor="middle">energia elettrica → resistenza e motore</text><text x="1320" y="548" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">aria calda in movimento + dispersioni</text><rect x="55" y="650" width="900" height="110" rx="24" fill="#fffbeb" stroke="#fbbf24" stroke-width="3"/><text x="505" y="694" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#92400e" text-anchor="middle">IDEA CHIAVE</text><text x="505" y="735" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#334155" text-anchor="middle">Una parte dell'energia produce l'effetto utile, una parte si disperde.</text><rect x="995" y="650" width="550" height="110" rx="24" fill="#f5f3ff" stroke="#a78bfa" stroke-width="3"/><text x="1270" y="694" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#6d28d9" text-anchor="middle">EFFICIENZA</text><text x="1270" y="735" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#334155" text-anchor="middle">Più energia utile + meno dispersioni</text><rect x="110" y="790" width="1380" height="60" rx="18" fill="#dcfce7" stroke="#86efac" stroke-width="3"/><text x="800" y="829" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#14532d" text-anchor="middle">Un sistema energetico trasforma energia per ottenere un risultato.</text></svg>