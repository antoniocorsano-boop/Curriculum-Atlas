function loadVoices(){ availableVoices=window.speechSynthesis?speechSynthesis.getVoices().filter(v=>/^it([-_]|$)/i.test(v.lang)):[]; populateVoices(); }
function chooseVoice(){
 loadVoices();
 return availableVoices.find(v=>v.voiceURI===preferredVoice) ||
   availableVoices.slice().sort((a,b)=>voiceWeight(b)-voiceWeight(a))[0] || null;
}
function voiceWeight(v){const x=(v.name+' '+v.voiceURI).toLowerCase();let n=0;
 if(/natural|neural|premium|enhanced|online|google|microsoft/.test(x))n+=4;
 if(/it-it|italiano|italian/.test(x))n+=2;
 if(v.localService)n+=1;
 return n;
}
function populateVoices(){
 const select=document.getElementById('voiceSelection');if(!select)return;
 const previously=select.value;
 select.innerHTML=availableVoices.length?availableVoices.map(v=>`<option value="${safe(v.voiceURI)}">${safe(v.name)} (${safe(v.lang)})</option>`).join(''):'<option value="">Nessuna voce italiana disponibile</option>';
 const best=availableVoices.find(v=>v.voiceURI===preferredVoice) || availableVoices.slice().sort((a,b)=>voiceWeight(b)-voiceWeight(a))[0];
 select.value=(availableVoices.some(v=>v.voiceURI===previously)?previously:best?.voiceURI)||'';
}

 if(activeRecording){activeRecording.pause();activeRecording.currentTime=0;activeRecording=null;}
 activeUtterance=null;st.autoNarrate=false;
}
function finishNarration(){stopNarration();st.stage=1;st.phase='intro';st.storyIndex=storyScenes.length-1;st.feedback=null;st.hint=false;render();}
function narrationEnded(){
 activeUtterance=null;activeRecording=null;
 if(!st.autoNarrate)return;
 if(st.storyIndex<storyScenes.length-1){st.storyIndex+=1;render();setTimeout(()=>{if(st.autoNarrate&&st.phase==='narration')speakScene(st.storyIndex);},360);}
 else{st.autoNarrate=false;render();}
}
function speakScene(index){
 const scene=storyScenes[index];if(!scene)return;
 if(activeRecording){activeRecording.pause();activeRecording=null;}
 if(window.speechSynthesis)speechSynthesis.cancel();
 if(narrationTracks[index]){
   const audio=new Audio(narrationTracks[index]);activeRecording=audio;
   audio.onended=narrationEnded;
   audio.onerror=()=>{activeRecording=null;st.autoNarrate=false;render();};
   audio.play().catch(()=>{activeRecording=null;st.autoNarrate=false;render();});
   return;
 }
 if(!window.speechSynthesis){st.autoNarrate=false;render();return;}
 const u=new SpeechSynthesisUtterance(scene.title+'. '+scene.text);
 const voice=chooseVoice();if(voice)u.voice=voice;
 u.lang=voice?.lang||'it-IT';u.rate=0.91;u.pitch=0.98;
 u.onend=narrationEnded;u.onerror=()=>{st.autoNarrate=false;activeUtterance=null;render();};
 activeUtterance=u;speechSynthesis.speak(u);
}
function startNarration(){st.autoNarrate=true;render();speakScene(st.storyIndex);}
if('speechSynthesis' in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;}
function tracksCount(){return Object.keys(narrationTracks).filter(k=>/^\d+$/.test(k)&&narrationTracks[k]).length;}
function saveEmbeddedHTML(){
 if(tracksCount()<5){alert(`Sono state inserite ${tracksCount()} tracce su 5. Per creare la versione completa occorrono tutte e cinque.`);return;}
 stopNarration();render();
 const original='/*M118_AUDIO_START*/';const finish='/*M118_AUDIO_END*/';
 const html='<!doctype html>\n'+document.documentElement.outerHTML;
 const start=html.indexOf(original),end=html.indexOf(finish,start);
 if(start<0||end<0){alert('Impossibile individuare lo spazio delle tracce audio.');return;}
 const embedded=html.slice(0,start+original.length)+JSON.stringify(narrationTracks)+html.slice(end);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([embedded],{type:'text/html;charset=utf-8'}));
 a.download='Missione_118_con_voce_professionale.html';document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
const rooms=[{name:'L’archivio dei futuri',short:'Il tentativo 118',label:'Prologo · Anno 2045',desc:'Tre sistemi fuori controllo. Un’ultima possibilità.'},{name:'La città che non dorme',short:'Notifiche',label:'Ambiente 1 · Attenzione digitale',desc:'Distingui le informazioni utili dalle distrazioni.'},{name:'Il tutor impeccabile',short:'Assistente IA',label:'Ambiente 2 · Intelligenza artificiale',desc:'Verifica le risposte e riprogetta il tutor.'},{name:'L’incrocio nel buio',short:'Sistemi di controllo',label:'Ambiente 3 · Sicurezza',desc:'Gestisci i semafori e reagisci a un guasto.'},{name:'La porta del futuro',short:'Protocollo 118',label:'Finale · Codice di accesso',desc:'Ricomponi i frammenti e stabilisci un principio.'}];
const arts=['cover','city','lab','traffic','end'];
const btn=(label,action,extra='',kind='primary')=>`<button type="button" class="${kind}" data-action="${action}" ${extra}>${label}</button>`;
const solvedCount=()=>st.solved.filter(Boolean).length;
const total=stage=>stage===1?5:stage===2?6:stage===3?4:1;
function track(){const len=total(st.stage);return `<div class="steps" aria-label="Passaggio ${Math.min(st.step+1,len)} di ${len}">${Array.from({length:len},(_,i)=>`<span class="dot ${i<st.step?'done':''} ${i===st.step?'current':''}"></span>`).join('')}</div>`;}
function frame(content,footer='',subhead='INCARICO ATTIVO'){
 const scene=rooms[st.stage],art=arts[st.stage];
 return `<div class="stage"><section class="visual" data-room="${st.stage}" aria-label="Ambientazione: ${scene.name}"><img src="${VISUAL_ASSETS[art]}" alt="${scene.desc}" decoding="async"><span class="visual-credits">TENTATIVO 118 · 2045</span><div class="visual-copy"><span class="visual-label">${scene.label}</span><h1 id="mainTitle">${scene.name}</h1><p>${scene.desc}</p></div></section><section class="control" aria-label="Area di azione"><div class="control-heading"><span class="eyebrow">${subhead}</span><span class="section-chip">${st.stage===0?'PROLOGO':st.won?'MISSIONE COMPIUTA':st.stage===4?'ULTIMA PORTA':'SCENA '+st.stage+' / 3'}</span></div><div class="panel-body ${st.phase==='play'?'at-start':''}" id="playPane">${content}</div><div class="stage-footer">${footer||'<span class="tiny">Il futuro si cambia una scelta alla volta.</span>'}</div></section></div>`;
}
function storyFrame(scene,content,footer='',subhead='VOCE NARRANTE'){
 return `<div class="stage"><section class="visual" data-room="0" aria-label="Ambientazione narrativa: ${scene.title}"><img src="${VISUAL_ASSETS[scene.art]}" alt="${scene.lede}" decoding="async"><span class="visual-credits">PROLOGO NARRATO · 2045</span><div class="visual-copy"><span class="visual-label">${scene.eyebrow}</span><h1 id="mainTitle">${scene.title}</h1><p>${scene.lede}</p></div></section><section class="control" aria-label="Area di narrazione"><div class="control-heading"><span class="eyebrow">${subhead}</span><span class="section-chip">SCENA ${st.storyIndex+1} / ${storyScenes.length}</span></div><div class="panel-body" id="playPane">${content}</div><div class="stage-footer">${footer}</div></section></div>`;
}
function narration(){
 const scene=storyScenes[st.storyIndex];
 const voiceAvailable='speechSynthesis' in window;
 const hasTrack=!!narrationTracks[st.storyIndex];
 const footer=`<div class="narrator-actions">${btn(st.autoNarrate?'Riproduzione in corso…':hasTrack?'▶ Ascolta la narrazione':'▶ Ascolta la voce italiana','narrate',st.autoNarrate?'disabled':'','primary')}${st.autoNarrate?btn('■ Interrompi','stopvoice','','secondary'):''}${btn(st.storyIndex===storyScenes.length-1?'Entra nella missione →':'Scena successiva →',st.storyIndex===storyScenes.length-1?'enterMission':'storynext','','secondary')}${btn('Salta prologo','enterMission','','secondary')}</div>`;
 const voicelabel=hasTrack?'Audio registrato: qualità indipendente dal dispositivo.':voiceAvailable?'Lettura del dispositivo: seleziona la voce italiana preferita nelle impostazioni.':'Il dispositivo non dispone di una voce italiana.';
 const controls=`<details class="voice-settings"><summary>Impostazioni audio per il docente · ${tracksCount()}/5 tracce</summary><div class="voice-settings-body"><label class="voice-label" for="voiceSelection">Voce italiana del dispositivo (se manca la registrazione)</label><select id="voiceSelection"></select><label class="voice-label" for="recordingImport">Inserisci la registrazione della scena ${st.storyIndex+1} (MP3, M4A, WAV)</label><input id="recordingImport" type="file" accept="audio/*" data-story="${st.storyIndex}"><p class="voice-state">Le registrazioni non vengono inviate online. Dopo aver inserito le cinque tracce, crea un unico HTML che contiene immagini, prove e voce professionale.</p><button type="button" class="secondary" data-action="exportAudio" ${tracksCount()===5?'':'disabled'}>Crea HTML con tutte le registrazioni</button></div></details>`;
 return storyFrame(scene,`<div class="narrator-stage"><span class="prompt-meta">Trasmissione dal 2045</span><span class="count">Scena ${st.storyIndex+1} di ${storyScenes.length}</span></div><h2 class="action-title">${scene.title}</h2><p class="action-subtitle">${scene.lede}</p>${narrator(scene.text)}<p class="voice-state">${voicelabel}</p>${controls}`,footer,'PROLOGO NARRATO');
}
function intro(){
 if(st.stage===0) return narration();
 const dialog=[null,['teo','«Le notifiche non si fermano. Come distinguo quelle importanti?»'],['ax','«Posso rispondere a ogni domanda. Ma chi controlla i miei errori?»'],['nora','«Il semaforo può guastarsi: dovremo capire come proteggerci.»'],['nora','«Avete recuperato tre frammenti. Scegliete quale regola deve guidare il futuro.»']][st.stage];
 const prompt=['','Decidi che cosa deve interrompere lo studio.','Controlla le affermazioni e scegli le funzioni utili.','Controlla i segnali e affronta il guasto.','Scegli il principio guida della squadra.'][st.stage];
 return frame(`<span class="prompt-meta">${st.stage===4?'Camera del Protocollo':'Briefing · Ambiente '+st.stage}</span><h2 class="action-title">${prompt}</h2>${speaker(dialog[0],dialog[1])}<p class="action-subtitle">${st.stage===4?'Il codice si apre con i tre frammenti, nell’ordine degli ambienti.':'Osserva. Decidi. Verifica l’effetto. Non c’è alcun conto alla rovescia.'}</p>`,btn(st.stage===4?'Scegli il principio →':'Inizia la prova →','begin'));
}
function answerChoices(options){return `<div class="options" role="group" aria-label="Scegli una risposta">${options.map((op,i)=>`<button class="option" type="button" data-action="answer" data-choice="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span class="opttext">${safe(op)}</span></button>`).join('')}</div>`;}
function play(){
 if(st.stage===1){const item=notifs[st.step],n=st.step+1;return frame(`<div class="micro-top"><span class="prompt-meta">Notifica ${n} di 5</span>${track()}</div>${speaker(n===1?'teo':'ax',n===1?'«Ne arriva un’altra. Devo leggerla subito?»':'«Analizza questa notifica prima di decidere.»')}<h2 class="prompt">${item.icon} ${safe(item.title)}</h2><p class="prompt-desc">${safe(item.desc)}</p>${answerChoices(['Mostra subito','Metti in pausa'])}${st.hint?`<div class="hint-panel"><strong>Indizio di Nora</strong><p>${safe(hintSets[0][0])}</p></div>`:''}`,btn(st.hint?'Chiudi indizio':'Indizio','hint','','secondary'),'SCEGLI UN’AZIONE');}
 if(st.stage===2){const i=st.step;if(i<4){const item=claims[i];return frame(`<div class="micro-top"><span class="prompt-meta">Affermazione ${i+1} di 4</span>${track()}</div>${speaker('ax','«Ho formulato questa risposta. Puoi verificarla?»')}<h2 class="prompt">${safe(item.text)}</h2><p class="prompt-desc">La frase è scientificamente corretta?</p>${answerChoices(['È corretta','Va corretta'])}${st.hint?`<div class="hint-panel"><strong>Indizio di Nora</strong><p>${safe(hintSets[1][0])}</p></div>`:''}`,btn(st.hint?'Chiudi indizio':'Indizio','hint','','secondary'),'VERIFICA LA RISPOSTA');}
 const n=i===4?1:2;const choices=modules.filter(x=>!st.modules.includes(x.id));return frame(`<div class="micro-top"><span class="prompt-meta">Progettazione · Funzione ${n} di 2</span>${track()}</div>${speaker('teo',n===1?'«Il tutor deve aiutarmi a ragionare, non fare tutto al posto mio.»':'«Ci serve anche un modo per verificare le risposte.»')}<h2 class="prompt">Quale funzione aggiungiamo al tutor?</h2><div class="options">${choices.map((op,i)=>`<button class="option" data-action="answer" data-choice="${i}" type="button"><span class="letter">${String.fromCharCode(65+i)}</span><span class="opttext"><strong>${safe(op.title)}</strong><small>${safe(op.desc)}</small></span></button>`).join('')}</div>${st.hint?`<div class="hint-panel"><strong>Indizio di Nora</strong><p>${safe(hintSets[1][1])}</p></div>`:''}`,btn(st.hint?'Chiudi indizio':'Indizio','hint','','secondary'),'PROGETTA IL TUTOR');}
 if(st.stage===3){const item=trafficSteps[st.step];return frame(`<div class="micro-top"><span class="prompt-meta">Controllo ${st.step+1} di 4</span>${track()}</div>${speaker('nora','«Osserva i segnali. Poi scegli un solo comando.»')}<h2 class="prompt">${safe(item.heading)}</h2><div class="signal-row"><div class="signal"><span class="signal-label">Auto</span><span class="signal-dot ${item.cars}"></span><strong>${item.cars==='green'?'Verde':item.cars==='amber'?'Giallo':'Rosso'}</strong></div><div class="signal"><span class="signal-label">Pedoni</span><strong>${item.walker==='go'?'🚶 Verde':'■ Rosso'}</strong></div></div><p class="prompt-desc">${safe(item.detail)}</p>${answerChoices(item.options)}${st.hint?`<div class="hint-panel"><strong>Indizio di Nora</strong><p>${safe(hintSets[2][0])}</p></div>`:''}`,btn(st.hint?'Chiudi indizio':'Indizio','hint','','secondary'),'DECIDI IL COMANDO');}
 if(st.stage===4)return principle();
 return intro();
}
function principle(){return frame(`<span class="prompt-meta">Protocollo 118 · Un’ultima decisione</span>${speaker('nora','«Non esiste una risposta unica: scegliete ciò che ritenete prioritario e spiegatelo in classe.»')}<h2 class="prompt">Quale principio proteggerete?</h2><div class="options">${[['scelta','Libertà di scelta','Le persone possono decidere.'],['verifica','Verifica umana','Le risposte si controllano.'],['sicurezza','Sicurezza','I guasti si gestiscono.']].map(([id,title,detail],i)=>`<button class="option principle" data-action="select-principle" data-choice="${id}" type="button"><span class="letter">${i+1}</span><span class="opttext"><strong>${title}</strong><small>${detail}</small></span></button>`).join('')}</div>`,'<span class="tiny">La vostra scelta sarà parte del messaggio finale.</span>','SCEGLI UN PRINCIPIO');}
function code(){return frame(`<span class="prompt-meta">Ultima porta</span><h2 class="action-title">Ricostruisci il codice finale.</h2>${speaker('ax','«I frammenti sono pronti. Inseriscili nell’ordine delle tre stanze.»')}<div class="big-code" aria-label="Tre frammenti recuperati">${st.digits.map((d,i)=>`<span class="code-digit" title="Ambiente ${i+1}">${d}</span>`).join('')}</div><form id="codeForm"><label class="screenreader" for="code">Codice delle tre cifre</label><input class="code-entry" id="code" maxlength="3" inputmode="numeric" autocomplete="off" placeholder="•••" pattern="[0-9]{3}" required aria-label="Codice di tre cifre"><button class="primary" style="width:100%" type="submit">Apri la porta →</button></form>${st.feedback?`<div class="status bad" role="alert">${safe(st.feedback)}</div>`:''}`,btn('Cambia principio','choose-again','','secondary'),'INSERISCI IL CODICE');}
function response(){const f=st.feedback;if(!f)return play();return frame(`<div class="result-art ${f.correct?'':'bad'}">${f.correct?'✓':'!'}</div><span class="prompt-meta">${f.correct?'Scelta confermata':'Il sistema segnala un problema'}</span><h2 class="action-title">${f.correct?'Funziona. Prosegui.':'Osserva e correggi.'}</h2>${speaker(f.who,safe(f.text))}<div class="status ${f.correct?'':'bad'}" role="status" aria-live="polite">${f.correct?'Il sistema ha registrato la tua decisione.':'Una soluzione tecnologica si può sempre riprogettare.'}</div>`,btn(f.correct?'Prossima decisione →':'Rivedi la scelta ↺',f.correct?'advance':'retry'),'EFFETTO DELLA SCELTA');}
function completion(){const n=st.stage,d=st.digits[n-1];return frame(`<div class="result-art">✓</div><span class="prompt-meta">Ambiente ${n} recuperato</span><h2 class="action-title">Sistema ripristinato.</h2>${speaker(n===1?'teo':n===2?'ax':'nora',n===1?'«Finalmente posso concentrarmi senza perdere gli avvisi davvero importanti.»':n===2?'«Le risposte ora si verificano, e gli studenti restano protagonisti.»':'«Il sistema riconosce il guasto e richiede un intervento umano.»')}<p class="action-subtitle">Frammento ottenuto</p><div class="big-code"><span class="code-digit">${d}</span></div>`,btn(n===3?'Raggiungi l’ultima porta →':'Entra nell’ambiente successivo →','nextstage'),'FRAMMENTO ACQUISITO');}
const principles={scelta:['Libertà di scelta','Le persone devono comprendere e modificare le decisioni tecnologiche.'],verifica:['Verifica umana','Le risposte importanti devono poter essere controllate e corrette.'],sicurezza:['Sicurezza','Se i dati non sono affidabili, il sistema deve agire con prudenza.']};
function ending(){const chosen=principles[st.focus]||principles.verifica;return frame(`<div class="result-art">✦</div><span class="prompt-meta">Protocollo 118 · Attivato</span><h2 class="action-title">Il futuro è cambiato.</h2>${speaker('nora','«Non avete eliminato la tecnologia. L’avete resa più utile, controllabile e sicura.»')}<div class="principle-picked">${chosen[0]}</div><p class="action-subtitle" style="margin-top:10px">${chosen[1]}</p><p class="tiny">Correzioni durante la missione: ${st.errors}. Anche correggere fa parte della progettazione.</p><div class="ending-list"><span>Attenzione</span><span>Verifica</span><span>Controllo umano</span></div><p class="prompt-desc" style="margin-top:12px"><strong>Missione per il gruppo:</strong> disegnate una tecnologia con problema, soluzione, possibile errore e controllo.</p>`,btn('Stampa l’esito','print','','secondary')+btn('Nuova missione ↺','reset'),'MISSIONE RIUSCITA');}
function render(){document.getElementById('headProgress').innerHTML=[0,1,2].map(i=>`<span class="hp ${st.solved[i]?'on':''}"></span>`).join('');document.getElementById('headProgress').setAttribute('aria-label',`${solvedCount()} di 3 ambienti risolti`);
 app.innerHTML=st.won?ending():st.phase==='narration'?narration():st.phase==='intro'?intro():st.phase==='play'?play():st.phase==='result'?response():st.phase==='complete'?completion():st.phase==='choose'?principle():st.phase==='code'?code():intro();
 save(); const panel=document.getElementById('playPane'); if(panel)panel.scrollTop=0; populateVoices();
}
function nextStage(){stopNarration();st.stage=Math.min(4,st.stage+1);st.phase='intro';st.step=0;st.feedback=null;st.hint=false;render();}
function begin(){stopNarration();st.phase=st.stage===4?'choose':'play';st.step=st.stage===1?st.notices.findIndex(x=>x===null):st.stage===2?st.claims.findIndex(x=>x===null):st.stage===3?st.traffic:0;if(st.step<0)st.step=st.stage===1?4:st.stage===2?4:0;st.hint=false;render();}
function wrong(who,text){st.errors++;st.feedback={correct:false,who,text};st.phase='result';st.hint=false;render();}
function right(who,text){st.feedback={correct:true,who,text};st.phase='result';st.hint=false;render();}
function chooseAnswer(idx){
 if(st.stage===1){const n=notifs[st.step],v=idx===0?'show':'pause';if(v!==n.correct){wrong('teo',n.impact);return;}st.notices[st.step]=v;right('ax',n.why);return;}
 if(st.stage===2){if(st.step<4){const n=claims[st.step],v=idx===0?'valid':'fix';if(v!==n.correct){wrong('nora',n.impact);return;}st.claims[st.step]=v;right('teo',v==='valid'?'Questa informazione è utilizzabile.':'L’errore è stato individuato: non ci fidiamo soltanto del tono della risposta.');return;}
 const available=modules.filter(x=>!st.modules.includes(x.id)),item=available[idx];if(!item)return;if(item.id!=='steps'&&item.id!=='verify'){wrong('teo','Questa funzione non aiuta a ragionare e verificare. Il tutor deve sostenere lo studente, non sostituirlo.');return;}st.modules.push(item.id);right('ax',item.id==='steps'?'Posso offrire indizi progressivi senza svolgere tutto al posto vostro.':'Posso invitare a verificare i risultati e riconoscere i miei limiti.');return;}
 if(st.stage===3){const item=trafficSteps[st.step];if(idx!==item.right){wrong('ax',item.impact);return;}right('nora',st.step===3?'Il guasto è riconosciuto: modalità prudente e avviso all’operatore.':'Segnali coerenti. La sequenza può continuare.');}
}
function advance(){st.feedback=null;st.hint=false;st.step++;if(st.stage===3)st.traffic=st.step;if(st.step>=total(st.stage)){st.solved[st.stage-1]=true;st.digits[st.stage-1]=({1:'3',2:'2',3:'4'})[st.stage];st.phase='complete';}else{st.phase='play';}render();}
function restart(){if(confirm('Ricominciare la missione? I progressi di questa versione saranno azzerati.')){stopNarration();st=initial();render();}}
const click=(selector,handler)=>document.addEventListener('click',e=>{const el=e.target.closest(selector);if(el&&!el.disabled)handler(el);});
document.getElementById('restart').addEventListener('click',restart);
click('[data-action]',b=>{switch(b.dataset.action){case 'exportAudio':saveEmbeddedHTML();break;case 'narrate':startNarration();break;case 'stopvoice':stopNarration();render();break;case 'storynext':stopNarration();st.storyIndex=Math.min(storyScenes.length-1,st.storyIndex+1);render();break;case 'storyprev':stopNarration();st.storyIndex=Math.max(0,st.storyIndex-1);render();break;case 'enterMission':finishNarration();break;case 'nextstage':nextStage();break;case 'begin':begin();break;case 'answer':chooseAnswer(Number(b.dataset.choice));break;case 'hint':st.hint=!st.hint;render();break;case 'retry':st.phase='play';st.feedback=null;render();break;case 'advance':advance();break;case 'select-principle':st.focus=b.dataset.choice;st.phase='code';render();break;case 'choose-again':st.phase='choose';st.feedback=null;render();break;case 'print':window.print();break;case 'reset':restart();break;}});
document.addEventListener('change',e=>{
 if(e.target.id==='voiceSelection'){
    preferredVoice=e.target.value;
    try{localStorage.setItem('m118_preferred_voice',preferredVoice);}catch(error){}
 }
 if(e.target.id==='recordingImport'){
  const file=e.target.files?.[0];if(!file)return;
  if(!file.type.startsWith('audio/')){alert('Seleziona un file audio.');return;}
  if(file.size>25*1024*1024){alert('Il file è troppo grande: usa una registrazione compressa.');return;}
  const scene=String(e.target.dataset.story);
  const reader=new FileReader();reader.onload=()=>{narrationTracks[scene]=String(reader.result);render();};
  reader.readAsDataURL(file);
 }
});
document.addEventListener('submit',e=>{if(e.target.id!=='codeForm')return;e.preventDefault();const entered=document.getElementById('code').value.trim();if(entered===st.digits.join('')&&solvedCount()===3){st.won=true;st.feedback=null;render();}else{st.errors++;st.feedback='Il codice non apre la porta. Controlla i frammenti nell’ordine 1 → 2 → 3.';render();}});
render();

})();
</script>
</body>
</html>
