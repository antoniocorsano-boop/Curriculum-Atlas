<path d="M 1308 174 V 165" stroke="#f1d29d" stroke-width="2" stroke-dasharray="5,5"/>
<rect x="63" y="797" width="1488" height="150" rx="20" fill="#10243a" stroke="#34516c"/>
<text x="89" y="834" fill="#f1d39b" font-size="22" font-weight="800" font-family="Arial,sans-serif">VINCOLI PER NON ROMPERE L'ILLUSIONE</text>
<g fill="#d9e4f0" font-size="19" font-family="Arial,sans-serif">
<text x="90" y="872">01  Camera quasi fissa; solo animazioni dei portali. Nessuna navigazione libera.</text>
<text x="90" y="909">02  Prima rimuovere dall'immagine i portali e i testi originari: altrimenti compaiono doppioni.</text>
<text x="890" y="872">03  Mascherare il podio davanti ai pannelli.</text>
<text x="890" y="909">04  Vista mobile distinta e alternativa accessibile.</text>
</g>
<text x="65" y="980" fill="#8faac1" font-size="16" font-family="Arial,sans-serif">Schema concettuale ricavato da ART-DIR-02 + ipotesi ibrida proposta dall'ideatore; NON usa il PNG canonico ancora non acquisito nel deposito.</text>
</svg>