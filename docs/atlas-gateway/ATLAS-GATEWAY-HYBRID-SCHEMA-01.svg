<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Atlas Hybrid 01 — Schema di composizione: immagine scenografica e quattro portali 3D</title>
<desc id="desc">Proposta esplorativa: la rotonda, il lucernario, il pavimento e il podio sono immagine; i quattro portali sono veri oggetti 3D, mentre interfaccia e destinazioni sono HTML accessibile. Lo schema non è una ricostruzione fotografica dell'originale.</desc>
