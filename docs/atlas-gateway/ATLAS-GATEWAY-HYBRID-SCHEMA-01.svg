  <linearGradient id="portal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#88cfff" stop-opacity=".33"/><stop offset=".25" stop-color="#226087" stop-opacity=".75"/><stop offset="1" stop-color="#0c294b" stop-opacity=".87"/></linearGradient>
  <linearGradient id="podio" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#28567c"/><stop offset="1" stop-color="#0b1c34"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a5d9f8"/><stop offset="1" stop-color="#5081ab"/></linearGradient>
  <clipPath id="stage"><rect x="63" y="165" width="941" height="605" rx="22"/></clipPath>
