<style>
:root{color-scheme:dark;--bg:#08131f;--panel:#102638;--gold:#f4d391;--muted:#b8cbd7;--line:#8ab5ca44;font:16px system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f0f7fa}button,a,input,select{font:inherit}button,a{cursor:pointer}button{color:inherit}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff0af;outline-offset:4px}[hidden]{display:none!important}#room{position:fixed;inset:0;overflow:hidden}#scene{width:100%;height:100%;border:0;background:#08131f}#scene-status{position:absolute;inset:0;display:grid;place-items:center;background:#08131f;z-index:2;text-align:center;padding:20px}#scene-status button{margin-top:18px}.mode{position:absolute;right:10px;top:64px;z-index:3;padding:7px 10px;background:#071524df;border:1px solid var(--line);border-radius:10px;font-size:11px}.fallback{height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:55px 20px 25px;background:radial-gradient(ellipse at 50% 8%,#7ca8c348,transparent 40%),repeating-conic-gradient(from 0deg at 50% 3%,#6f9abc15 0 1deg,transparent 1deg 30deg),radial-gradient(ellipse at center,#173950,#07111d 70%)}.fallback h1{font-size:clamp(28px,5vw,58px);letter-spacing:.26em;color:var(--gold);margin:0}.fallback p{text-align:center;color:var(--muted);margin:0}.fallback nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;width:min(900px,100%);align-items:center;perspective:900px}.portal{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;min-height:250px;text-decoration:none;border:1px solid #f5d99a;background:linear-gradient(140deg,#b0d7f22b,#17364bcc 60%,#75b7de29);border-radius:20px 20px 6px 6px;box-shadow:0 0 18px #d8b67544,inset 0 0 25px #9ad9ff22;padding:20px;text-align:center}.portal strong{font-size:clamp(18px,2.5vw,27px)}.portal small{color:var(--muted);line-height:1.4}.portal svg{width:70px;height:70px;stroke:var(--gold);fill:none;stroke-width:1.4}.portal.center{min-height:300px;background:linear-gradient(150deg,#76c8df55,#15374b,#9acbdd33)}.portal:hover{border-color:white;box-shadow:0 0 25px #eac77b88}.fallback .podium{width:240px;border:1px solid #f4d391;border-radius:50%;background:#13283b;box-shadow:0 0 30px #eac77b55;padding:12px 30px;text-align:center;letter-spacing:.2em;color:var(--gold)}.notice{font-size:12px;color:var(--muted)}
#page{min-height:100svh;background:radial-gradient(ellipse at 85% 0%,#16435855,transparent 40%),var(--bg)}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px max(16px,calc((100vw - 1120px)/2));background:#08131ff2;border-bottom:1px solid var(--line)}.wordmark{font-weight:750;letter-spacing:.19em;color:var(--gold);white-space:nowrap;text-decoration:none}.top nav{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.top nav a{padding:8px 10px;border-radius:9px;text-decoration:none;font-size:13px}.top nav a[aria-current=page]{color:var(--gold);background:#d9bd7830}.main{width:min(1120px,100%);margin:auto;padding:32px 20px 64px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.15em;color:var(--gold);font-weight:650}.intro h1{margin:8px 0;font-size:clamp(30px,5vw,53px);line-height:1.1}.intro p{max-width:720px;line-height:1.5;color:var(--muted)}.demo{border-left:2px solid var(--gold);padding:8px 12px;background:#e1bb6e0c;color:#dccda8;font-size:13px;margin:20px 0}.search{display:flex;gap:10px;margin:24px 0 16px}.search input{flex:1;min-width:0;color:#fff;background:#112a3b;border:1px solid var(--line);border-radius:12px;padding:14px 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}.tabs button,.secondary{border:1px solid var(--line);border-radius:10px;background:#12283b;padding:10px 13px}.tabs button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:linear-gradient(155deg,#17364a,#0e2131);display:flex;flex-direction:column}.card .art{height:155px;background:radial-gradient(ellipse at 65% 35%,#76aab766,transparent 55%),linear-gradient(120deg,#162d43,#0c1b2d);display:grid;place-items:center;border-bottom:1px solid var(--line)}.card .art svg{width:75px;height:75px;stroke:#f2d49c;fill:none;stroke-width:1.4}.card .content{padding:20px;flex:1;display:flex;flex-direction:column;gap:10px}.card h2{font-size:22px;margin:0}.card p{font-size:14px;color:var(--muted);line-height:1.5;margin:0}.card .cta{margin-top:auto;align-self:flex-start}.cta{display:inline-block;border:1px solid #f8db9e;background:linear-gradient(135deg,#ffe3a7,#d4a04f);color:#15202c;font-weight:700;border-radius:10px;padding:11px 16px;text-decoration:none}.cta:hover{filter:brightness(1.08)}.crumb{display:inline-block;color:var(--gold);margin:0 0 22px;font-size:14px}.panel{border:1px solid var(--line);border-radius:16px;padding:clamp(16px,4vw,30px);background:#11283b;margin:18px 0}.panel h2{margin:0 0 10px}.panel p{color:var(--muted);line-height:1.6}.panel a{display:inline-block;margin:8px 0}.slider{width:100%;accent-color:#f2ce85}.meter{height:16px;border-radius:20px;background:#08131f;overflow:hidden;border:1px solid var(--line)}.meter span{height:100%;display:block;background:linear-gradient(90deg,#4cacc3,#f1cb80);transition:width .2s}.process{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.process div{background:#091b2a;border:1px solid var(--line);padding:15px;border-radius:12px}.process strong{display:block;margin-bottom:4px;color:var(--gold)}.process small{color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#result{min-height:46px;line-height:1.5;color:#f5d9a1}.field{display:grid;gap:7px;margin:18px 0}.field select{color:#fff;background:#102638;border:1px solid var(--line);border-radius:10px;padding:10px}.section-label{margin:30px 0 14px;font-size:22px} @media(max-width:600px){.fallback{justify-content:flex-start}.fallback nav{grid-template-columns:1fr;gap:9px}.portal,.portal.center{min-height:0;display:grid;grid-template-columns:48px 1fr;gap:6px;text-align:left;padding:13px}.portal svg{grid-row:span 2;width:44px;height:44px}.portal small{grid-column:2}.portal strong{font-size:18px}.top{align-items:flex-start;flex-direction:column;gap:6px}.top nav{justify-content:flex-start}.top nav a{font-size:12px;padding:7px 8px}.main{padding-top:24px}.mode{top:auto;bottom:74px;right:6px}.fallback .podium{display:none}}@media(max-height:500px) and (min-width:601px){.fallback{justify-content:flex-start;gap:8px;padding:12px 20px}.portal,.portal.center{min-height:175px}.portal svg{width:43px;height:43px}.fallback .podium{display:none}.mode{top:8px;right:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media(max-width:600px){.mode{top:108px;bottom:auto;right:8px;font-size:10px;padding:5px 7px;opacity:.86}}@media(max-height:500px){.mode{top:8px;bottom:auto;right:8px}}
</style></head><body>
<section id="room" aria-label="Sala Atlas"><iframe id="scene" title="Sala tridimensionale Atlas" sandbox="allow-scripts"></iframe><button class="mode" id="simple" type="button">Vista semplificata</button><div id="scene-status" role="status"><div><div class="eyebrow">ATLAS</div><h2>Preparazione della sala</h2><p>Caricamento dell'ambiente tridimensionale.</p><button class="secondary" id="skip">Accedi senza 3D</button></div></div><div class="fallback" id="fallback" hidden><h1>ATLAS</h1><p>Conoscere il mondo. Comprenderlo. Immaginarlo diversamente.</p><nav aria-label="Accessi Atlas" id="fallback-portals"></nav><div class="podium">ATLAS</div><p class="notice" id="fallback-note">Modalità semplificata</p><button class="secondary" id="retry">Riprova vista 3D</button></div></section>
<section id="page" hidden><header class="top"><a class="wordmark" href="#sala">← ATLAS</a><nav aria-label="Ambienti Atlas"><a href="#curricolo" data-nav="curricolo">Curricolo</a><a href="#esperienze" data-nav="esperienze">Esperienze</a><a href="#studio" data-nav="studio">Studio</a></nav></header><main id="content" class="main" tabindex="-1"></main></section>
<script>
'use strict';
// Configurazione d'integrazione: assegnare i percorsi REALI della piattaforma, una volta verificati.
// null = anteprima locale. L'autorizzazione di Studio deve essere verificata dal servizio di destinazione.
const DESTINATIONS=Object.freeze({curricolo:null,esperienze:null,studio:null});
const iconPaths={curricolo:'<path d="M32 15Q18 8 6 14v36q14-6 26 1 12-7 26-1V14q-12-6-26 1v36M13 23l12 2m-12 7 12 2m14-9 12-2m-12 11 12-2"/>',esperienze:'<circle cx="32" cy="32" r="23"/><ellipse cx="32" cy="32" rx="11" ry="23"/><path d="M9 32h46M14 20q18 9 36 0M14 44q18-9 36 0"/>',studio:'<rect x="8" y="12" width="48" height="38" rx="5"/><path d="m15 41 14-15 9 9 6-7 8 10M32 50v8M21 58h22"/><circle cx="43" cy="20" r="3"/>',energia:'<path d="M36 5 14 35h17l-3 24 22-32H33z"/>',agricoltura:'<path d="M32 57V24M32 40Q10 39 9 16q21 0 23 24M32 29Q34 9 55 7q0 21-23 22M8 57h48"/>',reti:'<circle cx="32" cy="32" r="8"/><circle cx="10" cy="12" r="5"/><circle cx="54" cy="12" r="5"/><circle cx="10" cy="52" r="5"/><circle cx="54" cy="52" r="5"/><path d="m14 16 12 11m24-11L38 27M14 48l12-11m24 11L38 37"/>'};
const icon=k=>`<svg viewBox="0 0 64 64" aria-hidden="true">${iconPaths[k]||iconPaths.esperienze}</svg>`;
const portals=[{id:'curricolo',name:'Curricolo Atlas',sub:'Conoscenze, competenze e percorsi'},{id:'esperienze',name:'Esperienze Atlas',sub:'Storie, laboratori, scoperte e percorsi'},{id:'studio',name:'Studio Atlas',sub:'Produzione e qualità · area professionale'}];
const entries=[{id:'citta-energia',type:'Storie',world:'Energia',title:'La città che non dorme',desc:'Segui il viaggio dell’energia attraverso una città.',art:'energia',objective:'Riconoscere le trasformazioni dell’energia.'},{id:'atelier-energia',type:'Laboratori',world:'Energia',title:'Atelier dell’energia',desc:'Modifica la disponibilità di energia e osserva il sistema.',art:'energia',objective:'Interpretare il rapporto fra energia disponibile e domanda.'},{id:'sistema-agricolo',type:'Scoperte',world:'Agricoltura',title:'L’agricoltura come sistema',desc:'Collega risorse, trasformazioni e prodotti.',art:'agricoltura',objective:'Riconoscere gli elementi di un sistema tecnologico.'},{id:'filiera-locale',type:'Percorsi',world:'Agricoltura',title:'Dal campo alla tavola',desc:'Ricostruisci le relazioni di una filiera alimentare.',art:'reti',objective:'Descrivere le principali fasi di una filiera.'}];
const $=id=>document.getElementById(id);let timeout=null,sceneReady=false,sceneStarted=false,simple=false,current='sala';const frame=$('scene');const allowed=new Set(portals.map(p=>p.id));
$('fallback-portals').innerHTML=portals.map(p=>`<a href="#${p.id}" class="portal ${p.id==='esperienze'?'center':''}">${icon(p.id)}<strong>${p.name}</strong><small>${p.sub}</small></a>`).join('');
function fallback(reason){clearTimeout(timeout);simple=true;frame.hidden=true;$('scene-status').hidden=true;$('simple').hidden=true;$('fallback').hidden=false;$('fallback-note').textContent=reason;frame.contentWindow?.postMessage({type:'atlas-pause',value:true},'*');}
function startScene(){simple=false;sceneReady=false;sceneStarted=true;clearTimeout(timeout);$('fallback').hidden=true;frame.hidden=false;$('simple').hidden=false;$('scene-status').hidden=false;frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(SCENE_SOURCE),c=>c.charCodeAt(0)));timeout=setTimeout(()=>fallback('Motore 3D non disponibile. Tutti gli ambienti restano accessibili.'),12000);}
$('simple').onclick=()=>fallback('Vista semplificata selezionata.');$('skip').onclick=$('simple').onclick;$('retry').onclick=startScene;
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;const d=e.data;if(!d||typeof d!=='object')return;if(d.type==='atlas-3d-ready'&&!simple){clearTimeout(timeout);sceneReady=true;$('scene-status').hidden=true;if(current!=='sala')frame.contentWindow.postMessage({type:'atlas-pause',value:true},'*');}if(d.type==='atlas-3d-error'&&!simple)fallback('Motore 3D non disponibile. Tutti gli ambienti restano accessibili.');if(d.type==='atlas-open'&&allowed.has(d.id)&&current==='sala')location.hash=d.id;});
const intro=(tag,title,desc)=>`<div class="intro"><div class="eyebrow">${tag}</div><h1>${title}</h1><p>${desc}</p></div>`;
const demo='<div class="demo">Anteprima locale di progettazione: materiali esemplificativi, non pubblicati né qualificati per l’uso con gli studenti.</div>';
function route(){let [id,slug]=location.hash.slice(1).split('/');if(!allowed.has(id))id='sala';current=id;$('room').hidden=id!=='sala';$('page').hidden=id==='sala';if(id==='sala'){if(!sceneStarted)startScene();else if(!simple)frame.contentWindow?.postMessage({type:'atlas-pause',value:false},'*');return;}frame.contentWindow?.postMessage({type:'atlas-pause',value:true},'*');document.querySelectorAll('[data-nav]').forEach(a=>a.dataset.nav===id?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));let dest=DESTINATIONS[id];if(dest&&!(id==='esperienze'&&slug)){location.assign(dest);return;}if(id==='esperienze'){if(slug&&entries.some(x=>x.id===slug))renderExperience(slug);else library();}else if(id==='curricolo')curricolo();else studio();window.scrollTo(0,0);$('content').focus({preventScroll:true});}
function card(e){return `<article class="card"><div class="art">${icon(e.art)}</div><div class="content"><div class="eyebrow">${e.type} · ${e.world}</div><h2>${e.title}</h2><p>${e.desc}</p><a class="cta" href="#esperienze/${e.id}">Apri anteprima →</a></div></article>`;}
function library(){$('content').innerHTML=intro('Biblioteca dei mondi educativi','Esplora, scopri, comprendi.','Scegli una storia, entra in un laboratorio, scopri come funziona il mondo o segui un percorso. Puoi cercare direttamente ciò che ti interessa.')+demo+`<div class="search"><input id="search" type="search" aria-label="Cerca esperienze" placeholder="Cerca un tema o un’esperienza…"></div><div class="tabs" role="group" aria-label="Tipologia">${['Tutte','Storie','Laboratori','Scoperte','Percorsi'].map((t,i)=>`<button data-filter="${t}" aria-pressed="${i===0}">${t}</button>`).join('')}</div><div class="notice" id="count" aria-live="polite"></div><div class="cards" id="cards"></div>`;let filter='Tutte';function draw(){let q=$('search').value.trim().toLocaleLowerCase('it');let list=entries.filter(e=>(filter==='Tutte'||e.type===filter)&&[e.title,e.world,e.desc,e.objective].join(' ').toLocaleLowerCase('it').includes(q));$('count').textContent=`${list.length} esperienze dimostrative`; $('cards').innerHTML=list.length?list.map(card).join(''):'<p>Nessun risultato. Prova un’altra parola.</p>';} $('search').oninput=draw;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();});draw();}
function curricolo(){$('content').innerHTML=intro('Curricolo Atlas','Esplora le connessioni','Consulta gli ambiti disciplinari e il rapporto fra conoscenze, obiettivi, competenze ed esperienze. Il curricolo approvato resta governato in Arena.')+demo+`<div class="panel"><div class="eyebrow">Esempio di raccordo · Tecnologia</div><h2>Energia e trasformazioni</h2><p>Obiettivo esemplificativo: riconoscere le trasformazioni energetiche e interpretare i sistemi di produzione e utilizzo.</p><div class="actions"><a class="cta" href="#esperienze/atelier-energia">Laboratorio collegato →</a><a class="secondary" href="#esperienze/citta-energia">Storia collegata →</a></div></div><div class="panel"><div class="eyebrow">Esempio di raccordo · Tecnologia</div><h2>Agricoltura e sistemi produttivi</h2><p>Obiettivo esemplificativo: comprendere la relazione tra risorse, processi, prodotti e territorio.</p><div class="actions"><a class="cta" href="#esperienze/sistema-agricolo">Scoperta collegata →</a><a class="secondary" href="#esperienze/filiera-locale">Percorso collegato →</a></div></div>`;}
function studio(){$('content').innerHTML=intro('Studio Atlas · area professionale','Dall’idea all’esperienza','Ambiente di produzione, collaudo e revisione dei mondi educativi. La fruizione degli studenti rimane distinta dalla produzione.')+`<div class="demo">Accesso professionale non collegato in questa anteprima. Non è presente un sistema di autenticazione: nessun editor, dato riservato o comando di pubblicazione è esposto.</div><div class="process">${[['1. Idea','Obiettivi e raccordo curricolare'],['2. Progettazione','Storia, mondo, scene e azioni'],['3. Produzione','Risorse e motore esperienziale'],['4. Qualificazione','Collaudo, accessibilità e revisione'],['5. Pubblicazione','Solo dopo approvazione autorizzata']].map(([a,b])=>`<div><strong>${a}</strong><small>${b}</small></div>`).join('')}</div><div class="panel"><h2>Fruizione in Atlas</h2><p>Il contenuto qualificato viene pubblicato nella biblioteca. Questa anteprima non modifica i repository né pubblica contenuti.</p><a class="cta" href="#esperienze">Vai alla biblioteca →</a></div>`;}
function renderExperience(slug){let e=entries.find(x=>x.id===slug);$('content').innerHTML=`<a class="crumb" href="#esperienze">← Biblioteca</a>`+intro(e.type+' · '+e.world,e.title,e.desc)+demo+`<div class="panel" id="activity"></div><div class="panel"><h2>Connessione curricolare</h2><p>${e.objective}</p><a href="#curricolo">Esplora il curricolo →</a></div>`;let a=$('activity');if(slug==='atelier-energia'){a.innerHTML='<h2>Un modello di disponibilità energetica</h2><p>In questa simulazione semplificata, la città richiede 60 unità di energia. Cambia la disponibilità e osserva quanta domanda può essere soddisfatta.</p><label class="field" for="energy">Energia disponibile: <strong id="units">50 unità</strong><input id="energy" class="slider" type="range" min="0" max="100" value="50" step="5"></label><div class="meter" role="progressbar" aria-label="Domanda soddisfatta" aria-valuemin="0" aria-valuemax="100" aria-valuenow="83"><span id="bar"></span></div><p id="result" aria-live="polite"></p>';function update(){let n=+$('energy').value,p=Math.round(Math.min(n,60)/60*100);$('units').textContent=n+' unità';$('bar').style.width=p+'%';a.querySelector('.meter').setAttribute('aria-valuenow',p);$('result').textContent=`Domanda soddisfatta: ${p}%. ${n<60?'Mancano '+(60-n)+' unità.':n>60?'Restano '+(n-60)+' unità disponibili.':'Domanda interamente soddisfatta.'}`;}$('energy').oninput=update;update();}else if(slug==='citta-energia'){let steps=[['La sorgente','L’energia è disponibile in forme diverse, come quella del Sole, del vento o dell’acqua.'],['La trasformazione','Un sistema di conversione può trasformare una forma di energia in energia elettrica.'],['La città','Gli apparecchi trasformano l’energia elettrica in luce, calore o movimento.']];let i=0;a.innerHTML='<h2 id="step-title"></h2><p id="step-body"></p><div class="actions"><button class="secondary" id="prev">Indietro</button><button class="cta" id="next">Avanti</button></div>';function draw(){$('step-title').textContent=st
