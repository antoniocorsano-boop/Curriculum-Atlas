name: Atlas — AWC-D/E isolated dual derivation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/atlas-world-*.py'
      - 'scripts/verify-atlas-world-lab-variation.py'
      - 'scripts/test-atlas-world-*.py'
      - 'ops/atlas-scene-package/awc-*.json'
      - '.github/workflows/atlas-world-lab-variation.yml'
      - 'docs/atlas-gateway/ASC-01-AWC-CONSOLIDAMENTO.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-awc-d-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  live:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'work/asc-world-composer-consolidation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ATLAS_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: abfb83b9c9cf17d5c3e46c79eaa7ac9dab96e3cc
          path: producer
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify pinned Blender and syntax
        run: |
          bash scripts/atlas-gateway-c3/bootstrap-blender.sh
          python3 -m py_compile scripts/atlas-world-lab-variation.py scripts/verify-atlas-world-lab-variation.py scripts/atlas-world-artistic-derivative.py scripts/atlas-world-dual-derivation.py
          python3 scripts/test-atlas-world-compose.py
          test "$(git -C producer rev-parse HEAD)" = abfb83b9c9cf17d5c3e46c79eaa7ac9dab96e3cc
          node --check producer/scripts/test-atlas-bay-material-webgl.mjs
      - name: Recover exact master, material, context and AgX artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-live-input"
          mkdir -p "$p"/{finish,context,agx,bay} "$RUNNER_TEMP/asc-live-evidence"
          for spec in "14444143410 c7154de191cb6d25890a2881f470f6d6eeba74b2dcab897842f4753403e685c6 master" "14550684753 b0bfa200423cdb3b58e0b7bcfcefec6be68a8adbf6f93ca47817d76d8a80f633 finish" "14541319689 d1abd91c141ff35286d2ec005bcdf2a6556126aedcc29040b38e4ba5957fb225 context" "14542267386 508a424f41059a3b1cfaa30eff2315746545f866479235e5b5f2e915cce350e4 agx"; do
            read -r id sha name <<< "$spec"
            curl --fail --silent --show-error --location --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$p/$name.zip"
            printf '%s  %s\n' "$sha" "$p/$name.zip" | sha256sum --strict --check
          done
          unzip -p "$p/master.zip" Atlas-Scene-Master.blend > "$p/Atlas-Scene-Master.blend"
          printf '%s  %s\n' f216e3158c055de0990cd5f36ce388fe4731847fce12f2c42619b03806b9c3ab "$p/Atlas-Scene-Master.blend" | sha256sum --strict --check
          for f in surface-binding.json binding.rgba32f material-package.json material-finish.json roughness.rgb8; do unzip -p "$p/finish.zip" "$f" > "$p/finish/$f"; done
          for f in context-oracle.json occluders.f32; do unzip -p "$p/context.zip" "$f" > "$p/context/$f"; done
          for f in agx-lut.json agx-browser.json lut.rgba8; do unzip -p "$p/agx.zip" "$f" > "$p/agx/$f"; done
          chmod a-w "$p/Atlas-Scene-Master.blend" "$p"/{finish,context,agx}/*
      - name: Recover and replay exact AWC-B/C evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/awc-evidence"
          mkdir -p "$p"
          python3 - <<'PY' > "$p/manifest.tsv"
          import json
          for k,v in sorted(json.load(open("ops/atlas-scene-package/awc-evidence-index.json"))["archives"].items()):
              print(v["artifact"],v["sha256"])
          PY
          while read -r id sha; do
            curl --fail --silent --show-error --location --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$p/$id.zip"
            printf '%s  %s\n' "$sha" "$p/$id.zip" | sha256sum --strict --check
          done < "$p/manifest.tsv"
          python3 scripts/atlas-world-lab-variation.py --archives "$p" --producer producer --out "$RUNNER_TEMP/asc-live-evidence" --instrumented producer/scripts/.awc-d-isolated.mjs
          node --check producer/scripts/.awc-d-isolated.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Prepare existing verified WebGL engine
        run: |
          cd producer
          pnpm install --frozen-lockfile
          node scripts/build-atlas-gateway-local.mjs "$RUNNER_TEMP/asc-live-engine"
      - name: Install Chromium
        run: cd producer && pnpm exec playwright install --with-deps chromium
      - name: Export actual bay and source material inventory
        run: |
          p="$RUNNER_TEMP/asc-live-input"
          "$BLENDER_BIN" --background --factory-startup --disable-autoexec "$p/Atlas-Scene-Master.blend" --python-exit-code 1 --python producer/scripts/atlas-export-bay-preview.py -- "$p/Atlas-Scene-Master.blend" "$p/finish" "$p/bay"
          cp "$p/bay/bay.json" "$RUNNER_TEMP/asc-live-evidence/"
      - name: Apply the composed orbit variation and reset in the actual bay
        run: |
          p="$RUNNER_TEMP/asc-live-input"
          export AWC_LAB_PLAN="$RUNNER_TEMP/asc-live-evidence/lab-plan.json"
          node producer/scripts/.awc-d-isolated.mjs "$p/finish" "$p/context" "$p/agx" "$p/bay" "$RUNNER_TEMP/asc-live-evidence" "$RUNNER_TEMP/asc-live-engine/three.min.js"
      - name: Independently verify variation and exact rollback
        run: |
          python3 scripts/verify-atlas-world-lab-variation.py --out "$RUNNER_TEMP/asc-live-evidence" --archives "$RUNNER_TEMP/awc-evidence" --master "$RUNNER_TEMP/asc-live-input/Atlas-Scene-Master.blend" --revision "$ATLAS_EXACT_HEAD"
          git diff --exit-code
          git -C producer diff --exit-code
      - name: Render matched artistic derivative in Blender
        run: |
          p="$RUNNER_TEMP/asc-live-input"
          "$BLENDER_BIN" --background --factory-startup --disable-autoexec "$p/Atlas-Scene-Master.blend" --python-exit-code 1 --python scripts/atlas-world-artistic-derivative.py -- "$p/Atlas-Scene-Master.blend" "$RUNNER_TEMP/asc-live-evidence"
      - name: Verify dual derivation and historical D repeatability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-live-input"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14558434125/zip" -o "$p/awc-d.zip"
          printf '%s  %s\n' 2e196875a1f913959e2dcc7c7e2550fd2d7affe5520428a0496d5aa82e695b28 "$p/awc-d.zip" | sha256sum --strict --check
          python3 scripts/atlas-world-dual-derivation.py --out "$RUNNER_TEMP/asc-live-evidence" --prior "$p/awc-d.zip" --master "$p/Atlas-Scene-Master.blend" --revision "$ATLAS_EXACT_HEAD"
          git diff --exit-code
          git -C producer diff --exit-code
      - name: Preserve dual derivation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-awc-e-dual-derivation
          path: ${{ runner.temp }}/asc-live-evidence/
          retention-days: 7
          if-no-files-found: warn
