name: Atlas Canonical Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ATLAS_GITHUB_PAGES: "true"
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v4

      - name: Record exact head
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build static Atlas
        run: pnpm build

      - name: Enforce fail-closed Percorsi publication boundary
        run: |
          node scripts/test-percorsi-publication-filter.mjs
          node scripts/filter-unauthorized-pathway-routes.mjs out

      - name: Verify public materials in export
        run: |
          test -f out/materiali/index.html
          test -f out/materials/2026-09-23/1c/dal-bisogno-alla-soluzione-tecnica.svg
          test -f out/materials/2026-09-23/1c/scheda-studente.svg
          test -f out/materials/2026-09-23/2c/mappa-sistema-agricolo.svg
          test -f out/materials/2026-09-23/3e/dove-va-l-energia.svg
          test -f out/materials/2026-09-23/3e/scheda-studente.svg

      - name: Verify required Smart materials in export
        run: node scripts/verify-smart-export.mjs

      - name: Write release identity
        run: |
          printf '%s\n' \
            "Curriculum Atlas public release" \
            "sha=${{ steps.head.outputs.sha }}" \
            "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > out/RELEASE_IDENTITY.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy canonical Atlas
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout deployed exact main head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Smoke test public URLs
        run: |
          base="https://antoniocorsano-boop.github.io/Curriculum-Atlas"
          curl --fail --silent --show-error --location "$base/materiali/" > /dev/null
          curl --fail --silent --show-error --location "$base/materials/2026-09-23/1c/dal-bisogno-alla-soluzione-tecnica.svg" > /dev/null
          curl --fail --silent --show-error --location "$base/materials/2026-09-23/1c/scheda-studente.svg" > /dev/null
          curl --fail --silent --show-error --location "$base/materials/2026-09-23/2c/mappa-sistema-agricolo.svg" > /dev/null
          curl --fail --silent --show-error --location "$base/materials/2026-09-23/3e/dove-va-l-energia.svg" > /dev/null
          curl --fail --silent --show-error --location "$base/materials/2026-09-23/3e/scheda-studente.svg" > /dev/null

      - name: Verify Percorsi authorization boundary on deployed site
        run: node scripts/verify-public-pathway-boundary.mjs "https://antoniocorsano-boop.github.io/Curriculum-Atlas/"

      - name: Verify Smart assets and emit receipts
        shell: bash
        run: |
          set -euo pipefail
          base="https://antoniocorsano-boop.github.io/Curriculum-Atlas"
          mkdir -p .smart-receipts

          mapfile -t manifests < <(find content/smart-activities -type f -regextype posix-extended -regex '.*/material-set\.v[1-9][0-9]*\.json' -print | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "No machine-readable Smart material sets on deployed main; no asset receipts to verify."
          else
            for manifest in "${manifests[@]}"; do
              node scripts/verify-smart-published-materialset.mjs \
                --manifest "$manifest" \
                --base-url "$base" \
                --out-dir .smart-receipts
            done
          fi

          printf '{"schemaVersion":"atlas.smart.publication-receipt-bundle/v1","releaseSha":"%s"}\n' "$GITHUB_SHA" \
            > .smart-receipts/bundle.json

      - name: Upload Smart publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-publication-receipts-${{ github.sha }}
          path: .smart-receipts/
          if-no-files-found: error
          retention-days: 30
