name: Atlas Canonical Pages Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ATLAS_GITHUB_PAGES: "true"
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v4

      - name: Record exact head
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build static Atlas
        run: pnpm build

      - name: Verify public materials in export
        run: |
          test -f out/materiali/index.html
          test -f out/materials/2026-09-23/1c/dal-bisogno-alla-soluzione-tecnica.svg
          test -f out/materials/2026-09-23/1c/scheda-studente.svg
          test -f out/materials/2026-09-23/2c/mappa-sistema-agricolo.svg
          test -f out/materials/2026-09-23/3e/dove-va-l-energia.svg
          test -f out/materials/2026-09-23/3e/scheda-studente.svg

      - name: Write release identity
        run: |
          printf '%s\n' \
            "Curriculum Atlas public release" \
            "sha=${{ steps.head.outputs.sha }}" \
            "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > out/RELEASE_IDENTITY.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy canonical Atlas
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Smoke test public URLs
        run: |
          base="https://antoniocorsano-boop.github.io/Curriculum-Atlas"
          curl --fail --silent --show-error --location "$base/materiali/" > /dev/null
          curl --fail --silent --show-error --location "$base/materials/2026-09-23/1c/dal-bisogno-alla-soluzione-tecnica.svg" > /dev/null
          curl --fail --silent --show-error --location "$base/materials/2026-09-23/1c/scheda-studente.svg" > /dev/null
          curl --fail --silent --show-error --location "$base/materials/2026-09-23/2c/mappa-sistema-agricolo.svg" > /dev/null
          curl --fail --silent --show-error --location "$base/materials/2026-09-23/3e/dove-va-l-energia.svg" > /dev/null
          curl --fail --silent --show-error --location "$base/materials/2026-09-23/3e/scheda-studente.svg" > /dev/null
