name: Atlas Public Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-public-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main exact head
        uses: actions/checkout@v4

      - name: Record exact head
        run: echo "ATLAS_EXACT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build static Atlas
        run: npm run build

      - name: Verify public artifact
        run: |
          test -f out/index.html
          test -f out/materiali/index.html
          test -f out/materials/2026-09-23/1c/dal-bisogno-alla-soluzione-tecnica.svg
          test -f out/materials/2026-09-23/1c/scheda-studente.svg
          test -f out/materials/2026-09-23/3e/dove-va-l-energia.svg
          test -f out/materials/2026-09-23/3e/scheda-studente.svg
          printf '%s\n'             "ATLAS_PUBLIC_RELEASE"             "sha=$ATLAS_EXACT_SHA"             "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"             > out/RELEASE_IDENTITY.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Atlas public site
        id: deployment
        uses: actions/deploy-pages@v4
