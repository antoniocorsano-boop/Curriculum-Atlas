name: Atlas Perché Prototype

on:
  pull_request:
    paths:
      - "src/app/attivita/perche/**"
      - "src/components/atlas/activity-prototype.tsx"
      - "src/app/risorse/page.tsx"
      - "src/app/globals.css"
      - "public/activity-packages/perche-p3.json"
      - "public/sw-perche.js"
      - "scripts/test-perche-prototype.mjs"
      - ".github/workflows/perche-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Start app
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/atlas-perche.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/attivita/perche >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/atlas-perche.log
          exit 1

      - name: Browser + offline contract
        run: node scripts/test-perche-prototype.mjs

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: atlas-perche-prototype-evidence
          path: artifacts/perche-prototype/*.png
          if-no-files-found: error
