name: S1 Controlled Preview

on:
  push:
    branches:
      - work/s1-spatial-poc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: s1-controlled-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate canonical subset
        run: npm run test:data
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy S1 preview
        id: deployment
        uses: actions/deploy-pages@v4
