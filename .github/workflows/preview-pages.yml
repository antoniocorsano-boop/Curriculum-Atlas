name: S1 + P1 Controlled Preview

on:
  push:
    branches:
      - work/s1-spatial-poc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: s1-controlled-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable S1 exact head
        uses: actions/checkout@v4
        with:
          ref: 85d7be34e28547c516d0d1f12fdefff1d262951d
          path: s1

      - name: Checkout P1 exact head
        uses: actions/checkout@v4
        with:
          ref: fc509d3eba255432c2708256450c94c88e7eb6db
          path: p1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build S1 root
        working-directory: s1
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Build P1 preview
        working-directory: p1
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Assemble composite Pages site
        run: |
          mkdir -p site/p1-preview
          cp -a s1/dist/. site/
          cp -a p1/dist/. site/p1-preview/
          sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' site/p1-preview/index.html
          printf '%s\n' \
            "ATLAS-P1 navigable preview" \
            "p1_sha=fc509d3eba255432c2708256450c94c88e7eb6db" \
            "s1_sha=85d7be34e28547c516d0d1f12fdefff1d262951d" \
            "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > site/p1-preview/PREVIEW_IDENTITY.txt

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy S1 root + P1 isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
