name: Atlas — ASC-01 P2C2B real surface binding
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/atlas-scene-compiler-diffuse-bake.py'
      - 'scripts/atlas_surface_binding.py'
      - 'scripts/test-atlas-scene-compiler-surface-binding.mjs'
      - 'scripts/atlas_linear_texture_contract.py'
      - '.github/workflows/atlas-scene-compiler-surface-binding.yml'
      - 'docs/atlas-gateway/ASC-01-P2C2B-BINDING.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-asc-p2c2b-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  bake:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'work/atlas-production-standard-p2c2b' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ATLAS_CAPTURE_BINDING: '1'
      ATLAS_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify pinned Blender and syntax
        run: |
          bash scripts/atlas-gateway-c3/bootstrap-blender.sh
          python3 -m py_compile scripts/atlas-scene-compiler-diffuse-bake.py scripts/atlas_linear_texture_contract.py scripts/atlas_surface_binding.py
      - name: Recover exact immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-p2c-input"
          mkdir -p "$p" "$RUNNER_TEMP/asc-p2c-evidence"
          for spec in "14444143410 c7154de191cb6d25890a2881f470f6d6eeba74b2dcab897842f4753403e685c6 master" "14534077838 c37b3b289d6c4335a26e1139823e7134831a54ac53f98684cef05953838bb45e p2a" "14535186361 dd4d39defc5b5395ba13a34a2ef98606a7f88acf049efbb949bd2ab7b52fa2f0 p2b"; do
            read -r id sha name <<< "$spec"
            curl --fail --silent --show-error --location --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$p/$name.zip"
            printf '%s  %s\n' "$sha" "$p/$name.zip" | sha256sum --strict --check
          done
          unzip -p "$p/master.zip" Atlas-Scene-Master.blend > "$p/Atlas-Scene-Master.blend"
          unzip -p "$p/p2a.zip" page-ablation.json > "$p/page-ablation.json"
          unzip -p "$p/p2b.zip" page-extension.json > "$p/page-extension.json"
          printf '%s  %s\n' f216e3158c055de0990cd5f36ce388fe4731847fce12f2c42619b03806b9c3ab "$p/Atlas-Scene-Master.blend" | sha256sum --strict --check
          chmod a-w "$p/Atlas-Scene-Master.blend" "$p/page-ablation.json" "$p/page-extension.json"
      - name: Verify previous P2C1 and P2C2A receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-p2c-input"
          for spec in "14537109005 c3e8ae8ca0a6309f4cbfd42d63374d29eebe986c70b6cd18bb30ae199d7205b5 prior-bake" "14539027805 8df2fa86f541eac8648c54d1805bf3663945fb47c01be5a6aac8f25663a8caf0 prior-browser"; do
            read -r id sha name <<< "$spec"
            curl --fail --silent --show-error --location --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$p/$name.zip"
            printf '%s  %s\n' "$sha" "$p/$name.zip" | sha256sum --strict --check
          done
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"asc-p2c-input"
          def read(name,filename):
              with zipfile.ZipFile(p/name) as z:
                  matches=[n for n in z.namelist() if pathlib.PurePosixPath(n).name==filename]
                  assert len(matches)==1, matches
                  return json.loads(z.read(matches[0]))
          a=read("prior-bake.zip","diffuse-bake.json")
          b=read("prior-browser.zip","browser-transfer.json")
          assert a["revision"]=="d635d295340609af25ab0eca2c6258f4da7faa79" and a["status"]=="PASS_DIFFUSE_BAKE_PROBE"
          assert b["revision"]=="608233103c03c9b5dd20620351fd033c5d4c0ec8" and b["status"]=="PASS_GPU_TRANSFER_PROBE"
          assert a["masterUnchanged"] and a["bindingsRestored"] and not b["externalRequests"] and not b["pageErrors"]
          assert all(x["linear"]["outsideTolerance"]==x["display"]["outsideTolerance"]==0 for x in b["result"]["records"].values())
          (p/"prior-bake.json").write_text(json.dumps(a))
          PY
      - name: Real visible-surface bake and A B A comparison
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-p2c-input"
          out="$RUNNER_TEMP/asc-p2c-evidence"
          timeout 1950 "$BLENDER_BIN" --background --factory-startup --disable-autoexec "$p/Atlas-Scene-Master.blend" --python-exit-code 1 --python scripts/atlas-scene-compiler-diffuse-bake.py -- "$p/Atlas-Scene-Master.blend" "$p/page-ablation.json" "$p/page-extension.json" "$out" 2>&1 | tee "$out/run.log"
      - name: Verify linear texture receipt and rollback
        run: |
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"asc-p2c-evidence"
          r=json.loads((p/"diffuse-bake.json").read_text())
          assert r["status"]=="PASS_DIFFUSE_BAKE_PROBE" and r["revision"]==os.environ["ATLAS_EXACT_HEAD"]
          assert r["masterUnchanged"] and r["bindingsRestored"]
          assert r["target"]["firstHits"]>0 and r["target"]["sampledRays"]==6144
          assert r["uv"]["sampledOverlapTexels"]==0 and r["uv"]["sampledOccupiedTexels"]>100
          assert r["bake"]["rgbMax"]>0 and r["bake"]["rgbStd"]>0
          assert r["transferPreflight"]["passed"] and r["transferPreflight"]["explicit"]["outsideTolerance"]==0
          assert r["transferPreflight"]["explicit"]["channels"]=={"R":2,"G":2,"B":2}
          assert r["transfer"]["outsideTolerance"]==0 and r["transfer"]["channels"]=={"R":2,"G":2,"B":2}
          assert "legacyTransfer" in r
          assert hashlib.sha256((p/"canary-linear.exr").read_bytes()).hexdigest()==r["transferPreflight"]["explicit"]["sha256"]
          assert hashlib.sha256((p/"diffuse-linear.exr").read_bytes()).hexdigest()==r["bake"]["sha256"]
          assert set(r["renders"])=={"native-baseline","native-baked-preview","native-restored"}
          for name,m in r["renders"].items():
              assert hashlib.sha256((p/(name+".png")).read_bytes()).hexdigest()==m["sha256"]
          assert r["comparisons"]["restored"]["meanAbsoluteRGBDelta"]<.0002
          assert not any(r[k] for k in ("masterModified","runtimeModified","artisticApproval","webglQualified","studentAuthorized","publishable","lightmapTransferQualified"))
          print("ASC-P2C1 diffuse bake probe verified; no artistic or WebGL promotion.")
          PY
      - name: Verify matched geometry, camera and texture
        run: |
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          e=p/"asc-p2c-evidence"
          r=json.loads((e/"diffuse-bake.json").read_text())
          old=json.loads((p/"asc-p2c-input/prior-bake.json").read_text())
          b=json.loads((e/"surface-binding.json").read_text())
          assert r["target"]==old["target"]==b["target"]
          assert r["masterSha256"]==old["masterSha256"]==b["masterSha256"]
          assert b["revision"]==r["revision"]==os.environ["ATLAS_EXACT_HEAD"]
          assert b["triangles"]==r["uv"]["triangles"]==old["uv"]["triangles"]
          assert b["uvLayer"]==r["uv"]["layer"] and not b["originalP2C1UvProven"]
          assert len(b["positions"])==len(b["uv"])==3*b["triangles"]
          assert b["texture"]["sourceExrSha256"]==r["transfer"]["sha256"]
          assert b["texture"]["sha256"]==hashlib.sha256((e/"binding.rgba32f").read_bytes()).hexdigest()
          assert (e/"binding.rgba32f").stat().st_size==b["texture"]["width"]*b["texture"]["height"]*16
          print("Matched new bake and geometry; original UV identity not assumed.")
          PY
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Prepare existing verified WebGL engine
        run: |
          pnpm install --frozen-lockfile
          node scripts/build-atlas-gateway-local.mjs "$RUNNER_TEMP/asc-p2c2b-engine"
          node --check scripts/test-atlas-scene-compiler-surface-binding.mjs
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Compare actual target in original camera with CPU reference
        run: |
          node scripts/test-atlas-scene-compiler-surface-binding.mjs "$RUNNER_TEMP/asc-p2c-evidence" "$RUNNER_TEMP/asc-p2c2b-engine/three.min.js" "$RUNNER_TEMP/asc-p2c-evidence"
      - name: Verify browser binding receipt
        run: |
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"asc-p2c-evidence"
          r=json.loads((p/"surface-browser.json").read_text())
          assert r["revision"]==os.environ["ATLAS_EXACT_HEAD"]
          assert r["status"]=="PASS_ISOLATED_SURFACE_BINDING"
          assert not r["externalRequests"] and not r["pageErrors"]
          assert r["bindingSha256"]==hashlib.sha256((p/"surface-binding.json").read_bytes()).hexdigest()
          x=r["result"]; m=x["metrics"]
          assert m["testedUV"]>=100 and m["testedColor"]>=50 and m["badUV"]==m["badColor"]==0
          assert not any(x[k] for k in ("originalP2C1UvProven","fullSceneQualified","agxEquivalent","artisticApproval","physicalDeviceQualified","publishable"))
          assert (p/"isolated-surface-gpu.png").stat().st_size>0
          PY
      - name: Preserve bake and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-asc-p2c2b-real-surface-binding
          path: ${{ runner.temp }}/asc-p2c-evidence/
          retention-days: 7
          if-no-files-found: warn
