      - name: Render two non-qualifying preview views
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/smart-preview.py -- produce "$RUNNER_TEMP/atlas-fast-preview" "$CANDIDATE_SCRIPT"
      - name: Independently verify preview-only evidence
        run: python3 scripts/atlas-gateway-c3/smart-preview.py verify "$RUNNER_TEMP/atlas-fast-preview" "$CANDIDATE_SCRIPT"
      - name: Preserve preview images and receipt only
