name: Atlas Gateway — C3.1 Blender bay

on:
  pull_request:
    paths:
      - "scripts/atlas-gateway-c3/**"
      - "docs/atlas-gateway/AG-04C3-FILIERA-3D.md"
      - ".github/workflows/atlas-gateway-c3-bay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materials:
    name: C3.2A source resources
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Offline metadata contract
        run: python3 scripts/atlas-gateway-c3/acquire-materials.py --selftest
      - name: Restore qualified CC0 source bundle
        id: materials-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/atlas-materials
          key: atlas-c32-cc0-v1-fdaece268416cfe071dc33d72be9de529e4e713086b6d7708b68f1fa526d827c
      - name: Acquire if absent and verify all source bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-materials"
          if [[ "${{ steps.materials-cache.outputs.cache-hit }}" != true ]]; then
            python3 scripts/atlas-gateway-c3/locked-materials.py recover "$RUNNER_TEMP/atlas-materials"
          fi
          python3 scripts/atlas-gateway-c3/locked-materials.py verify "$RUNNER_TEMP/atlas-materials"
          python3 scripts/atlas-gateway-c3/locked-materials.py negative "$RUNNER_TEMP/atlas-materials"
      - name: Save verified locked sources
        if: steps.materials-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/atlas-materials
          key: ${{ steps.materials-cache.outputs.cache-primary-key }}
      - name: Transfer verified source bundle
        uses: actions/upload-artifact@v4
        with:
          name: atlas-c32-source-bundle
          path: ${{ runner.temp }}/atlas-materials/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve source diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-c32-source-diagnostics
          path: ${{ runner.temp }}/atlas-materials/
          if-no-files-found: ignore
          retention-days: 7

  environment:
    name: Qualified Blender environment and baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore pinned Blender archive
        id: blender-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify and bootstrap Blender
        run: bash scripts/atlas-gateway-c3/bootstrap-blender.sh
      - name: Save verified Blender archive before rendering
        if: steps.blender-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: ${{ steps.blender-cache.outputs.cache-primary-key }}
      - name: Preflight GLB exporter and actual Cycles denoising
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/preflight.py -- "$RUNNER_TEMP/atlas-c3" 2>&1 | tee "$RUNNER_TEMP/atlas-c3/preflight.log"
      - name: Build and render baseline bay
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/bay.py -- "$RUNNER_TEMP/atlas-c3" 2>&1 | tee "$RUNNER_TEMP/atlas-c3/blender.log"
      - name: Verify baseline evidence
        run: |
          set -euo pipefail
          python3 scripts/atlas-gateway-c3/verify.py "$RUNNER_TEMP/atlas-c3" | tee "$RUNNER_TEMP/atlas-c3/verification.json"
      - name: Preserve baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-gateway-c3-bay
          path: ${{ runner.temp }}/atlas-c3/
          if-no-files-found: ignore
          retention-days: 7

  production:
    name: C3.2A textured production
    needs: [materials, environment]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore pinned Blender archive
        id: blender-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify Blender bytes again
        run: bash scripts/atlas-gateway-c3/bootstrap-blender.sh
      - name: Download verified sources from same run
        uses: actions/download-artifact@v4
        with:
          name: atlas-c32-source-bundle
          path: ${{ runner.temp }}/atlas-c32/assets
      - name: Reverify source bundle offline
        run: python3 scripts/atlas-gateway-c3/locked-materials.py verify "$RUNNER_TEMP/atlas-c32/assets"
      - name: Preflight production executable
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/preflight.py -- "$RUNNER_TEMP/atlas-c3" 2>&1 | tee "$RUNNER_TEMP/atlas-c3/preflight.log"
      - name: Build textured and merged bay
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/bay-textured.py -- "$RUNNER_TEMP/atlas-c32" 2>&1 | tee "$RUNNER_TEMP/atlas-c32/blender.log"
      - name: Verify materials, mesh budget and self-contained GLB
        run: |
          set -euo pipefail
          python3 scripts/atlas-gateway-c3/verify-textured.py "$RUNNER_TEMP/atlas-c32" | tee "$RUNNER_TEMP/atlas-c32/verification.json"
      - name: Preserve production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-gateway-c32-textured
          path: |
            ${{ runner.temp }}/atlas-c32/
            ${{ runner.temp }}/atlas-c3/
          if-no-files-found: ignore
          retention-days: 7

      - name: C3.2B bake ambient occlusion in a second UV atlas
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-c32b"
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/bake-ao.py -- "$RUNNER_TEMP/atlas-c32b" 2>&1 | tee "$RUNNER_TEMP/atlas-c32b/bake.log"
      - name: C3.2B embed AO and verify GLB contract
        run: |
          set -euo pipefail
          python3 scripts/atlas-gateway-c3/embed-ao.py "$RUNNER_TEMP/atlas-c32b"
      - name: Preserve AO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-c32b-ao
          path: ${{ runner.temp }}/atlas-c32b/
          if-no-files-found: ignore
          retention-days: 7

  ao-webgl:
    name: C3.2B isolated Three.js AO comparison
    needs: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install existing application dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Record browser toolchain versions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-c32b-webgl"
          { node --version; pnpm --version; pnpm exec playwright --version; } | tee "$RUNNER_TEMP/atlas-c32b-webgl/toolchain.log"
      - uses: actions/download-artifact@v4
        with:
          name: atlas-c32b-ao
          path: ${{ runner.temp }}/atlas-c32b
      - name: Compare AO disabled and enabled in local r128
        run: node scripts/atlas-gateway-c3/test-ao-webgl.mjs "$RUNNER_TEMP/atlas-c32b" "$RUNNER_TEMP/atlas-c32b-webgl"
      - name: Preserve actual browser screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-c32b-webgl
          path: ${{ runner.temp }}/atlas-c32b-webgl/
          if-no-files-found: ignore
          retention-days: 7

  library-composition:
    name: C3.3A circular library architectural prototype
    needs: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore pinned Blender archive
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify Blender
        run: bash scripts/atlas-gateway-c3/bootstrap-blender.sh
      - name: Download verified baseline production
        uses: actions/download-artifact@v4
        with:
          name: atlas-gateway-c32-textured
          path: ${{ runner.temp }}
      - name: Download verified AO module
        uses: actions/download-artifact@v4
        with:
          name: atlas-c32b-ao
          path: ${{ runner.temp }}/atlas-c32b
      - name: Compose and render circular library
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-c33"
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/library-composition.py -- "$RUNNER_TEMP/atlas-c33" 2>&1 | tee "$RUNNER_TEMP/atlas-c33/library.log"
      - name: Verify architecture and shared module contract
        run: python3 scripts/atlas-gateway-c3/verify-library.py "$RUNNER_TEMP/atlas-c33"
      - name: Preserve architecture and three real renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-c33a-library
          path: ${{ runner.temp }}/atlas-c33/
          if-no-files-found: ignore
          retention-days: 7

      - name: C3.3A2 refined photographic exterior and varied shelves
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-c33-refined"
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/library-refined.py -- "$RUNNER_TEMP/atlas-c33-refined" 2>&1 | tee "$RUNNER_TEMP/atlas-c33-refined/library.log"
      - name: Verify refined architecture and variants
        run: python3 scripts/atlas-gateway-c3/verify-library-refined.py "$RUNNER_TEMP/atlas-c33-refined"
      - name: Preserve refined architecture and three real renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-c33a2-refined
          path: ${{ runner.temp }}/atlas-c33-refined/
          if-no-files-found: ignore
          retention-days: 7

      - name: C3.3A3 art-directed sky and architecture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-c33-art-directed"
          python3 -m py_compile scripts/atlas-gateway-c3/library-art-directed.py
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/library-art-directed.py -- "$RUNNER_TEMP/atlas-c33-art-directed" 2>&1 | tee "$RUNNER_TEMP/atlas-c33-art-directed/library.log"
      - name: Verify C3.3A3 offline contract
        run: python3 scripts/atlas-gateway-c3/library-art-directed.py --verify "$RUNNER_TEMP/atlas-c33-art-directed"
      - name: Preserve C3.3A3 actual renders and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-c33a3-art-directed
          path: ${{ runner.temp }}/atlas-c33-art-directed/
          if-no-files-found: ignore
          retention-days: 7

  master-architecture:
    name: C3.3A4.1 architectural master
    needs: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore pinned Blender archive
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify Blender
        run: bash scripts/atlas-gateway-c3/bootstrap-blender.sh
      - uses: actions/download-artifact@v4
        with:
          name: atlas-gateway-c32-textured
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: atlas-c32b-ao
          path: ${{ runner.temp }}/atlas-c32b
      - name: Produce architectural master from locked sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-c33-master-architecture"
          python3 -m py_compile scripts/atlas-gateway-c3/library-master-architecture.py
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/library-master-architecture.py -- "$RUNNER_TEMP/atlas-c33-master-architecture" 2>&1 | tee "$RUNNER_TEMP/atlas-c33-master-architecture/library.log"
      - name: Verify offline architecture contract
        run: python3 scripts/atlas-gateway-c3/library-master-architecture.py --verify "$RUNNER_TEMP/atlas-c33-master-architecture"
      - name: Preserve master architecture and actual renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-c33a41-architecture
          path: ${{ runner.temp }}/atlas-c33-master-architecture/
          if-no-files-found: ignore
          retention-days: 7

  master-materials:
    name: C3.3A4.2 material and typography master
    needs: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore pinned Blender archive
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify Blender
        run: bash scripts/atlas-gateway-c3/bootstrap-blender.sh
      - uses: actions/download-artifact@v4
        with:
          name: atlas-gateway-c32-textured
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: atlas-c32b-ao
          path: ${{ runner.temp }}/atlas-c32b
      - name: Produce material and typography study from locked sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-c33-master-materials"
          python3 -m py_compile scripts/atlas-gateway-c3/library-master-materials.py
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/library-master-materials.py -- "$RUNNER_TEMP/atlas-c33-master-materials" 2>&1 | tee "$RUNNER_TEMP/atlas-c33-master-materials/library.log"
      - name: Verify offline materials and typography contract
        run: python3 scripts/atlas-gateway-c3/library-master-materials.py --verify "$RUNNER_TEMP/atlas-c33-master-materials"
      - name: Preserve master materials and actual renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-c33a42-materials
          path: ${{ runner.temp }}/atlas-c33-master-materials/
          if-no-files-found: ignore
          retention-days: 7

  master-scenography:
    name: C3.3A4.3 cultural scenography master
    needs: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore pinned Blender archive
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify Blender
        run: bash scripts/atlas-gateway-c3/bootstrap-blender.sh
      - uses: actions/download-artifact@v4
        with:
          name: atlas-gateway-c32-textured
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: atlas-c32b-ao
          path: ${{ runner.temp }}/atlas-c32b
      - name: Produce original scenography from locked sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-c33-master-scenography"
          python3 -m py_compile scripts/atlas-gateway-c3/library-master-scenography.py
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python scripts/atlas-gateway-c3/library-master-scenography.py -- "$RUNNER_TEMP/atlas-c33-master-scenography" 2>&1 | tee "$RUNNER_TEMP/atlas-c33-master-scenography/library.log"
      - name: Verify offline scenography and spatial clearance contract
        run: python3 scripts/atlas-gateway-c3/library-master-scenography.py --verify "$RUNNER_TEMP/atlas-c33-master-scenography"
      - name: Preserve scenography master and actual renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-c33a43-scenography
          path: ${{ runner.temp }}/atlas-c33-master-scenography/
          if-no-files-found: ignore
          retention-days: 7
