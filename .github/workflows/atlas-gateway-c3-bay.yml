  smart-current:
    name: Smart Production — current candidate qualification
    needs: [production, plan]
    if: needs.plan.outputs.mode != 'fast'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_SCRIPT: ${{ needs.plan.outputs.script }}
      CANDIDATE_PHASE: ${{ needs.plan.outputs.phase }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Restore pinned Blender archive
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify Blender
        run: bash scripts/atlas-gateway-c3/bootstrap-blender.sh
      - uses: actions/download-artifact@v4
        with:
          name: atlas-gateway-c32-textured
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: atlas-c32b-ao
          path: ${{ runner.temp }}/atlas-c32b
      - name: Produce current candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-smart-current"
          script="scripts/atlas-gateway-c3/$CANDIDATE_SCRIPT"
          python3 -m py_compile "$script"
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 1 --python "$script" -- "$RUNNER_TEMP/atlas-smart-current" 2>&1 | tee "$RUNNER_TEMP/atlas-smart-current/library.log"
      - name: Verify full current candidate contract
        run: |
          set -euo pipefail
          python3 "scripts/atlas-gateway-c3/$CANDIDATE_SCRIPT" --verify "$RUNNER_TEMP/atlas-smart-current"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"atlas-smart-current"; m=json.loads((p/"library-verification.json").read_text()); assert m["phase"]==os.environ["CANDIDATE_PHASE"] and m["status"]=="PASS"'
      - name: Preserve current candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/atlas-smart-current/
          if-no-files-found: error
          retention-days: 7


