name: ATLAS P2C — Anteprima privata WebGL e quattro accessi
on:
  push:
    branches: [work/atlas-artdir02-p2-composizioni-01]
    paths:
      - "scripts/atlas-gateway-production/p2c-private-viewer.html"
      - "scripts/atlas-gateway-production/p2c_browser_probe.mjs"
      - ".github/workflows/atlas-p2c-private-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  p2c-private-webgl-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Recover exact P2C true 3D GLB from qualified Blender export
        uses: actions/download-artifact@v4
        with:
          run-id: 45143529888
          pattern: atlas-p2c-genuine-four-portal-glb-4
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p2c
      - name: Verify immutable real GLB and provenance
        run: |
          python3 - <<'PY'
          import hashlib,json,os,struct
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"p2c"
          report=json.loads((root/"atlas-p2c-webgl-receipt.json").read_text())
          f=root/"atlas-p2c-atrio-4-portali.glb"
          assert f.stat().st_size==1495236
          assert hashlib.sha256(f.read_bytes()).hexdigest()=="0cfaf8c65569db2c2f781199194e975c2ea265f0dc4399f7e009bf348afebce0"
          assert struct.unpack("<III",f.read_bytes()[:12])==(0x46546c67,2,1495236)
          assert len(report["portals"])==4
          assert not report["art_final_approved"] and not report["web_product_approved"]
          print("P2C_REAL_ARCHITECTURE_GLB_SHA_VERIFIED")
          PY
      - name: Install application test runtime and local, pinned Three.js
        run: |
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/p2c-viewer"
          npm pack three@0.128.0 --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent
          tar -xOf "$RUNNER_TEMP/three-0.128.0.tgz" package/build/three.min.js > "$RUNNER_TEMP/p2c-viewer/three.min.js"
          tar -xOf "$RUNNER_TEMP/three-0.128.0.tgz" package/examples/js/loaders/GLTFLoader.js > "$RUNNER_TEMP/p2c-viewer/GLTFLoader.js"
          tar -xOf "$RUNNER_TEMP/three-0.128.0.tgz" package/LICENSE > "$RUNNER_TEMP/p2c-viewer/THREE-LICENSE.txt"
          test "$(git hash-object "$RUNNER_TEMP/p2c-viewer/three.min.js")" = b14f47c0908bab15e890b468d53bb07db0be3a18
          test "$(git hash-object "$RUNNER_TEMP/p2c-viewer/GLTFLoader.js")" = cfa518ede1b0893f1da14347d78fcd19355f3686
          test "$(git hash-object "$RUNNER_TEMP/p2c-viewer/THREE-LICENSE.txt")" = 5303437e406ed22d8cb0b4c12398870792a25878
          cp scripts/atlas-gateway-production/p2c-private-viewer.html "$RUNNER_TEMP/p2c-viewer/index.html"
          cp "$RUNNER_TEMP/p2c/atlas-p2c-atrio-4-portali.glb" "$RUNNER_TEMP/p2c-viewer/"
          cp "$RUNNER_TEMP/p2c/atlas-p2c-webgl-receipt.json" "$RUNNER_TEMP/p2c-viewer/"
      - name: Install Chromium for actual 3D rendering
        run: pnpm exec playwright install --with-deps chromium
      - name: Serve local preview and verify desktop, smartphone, all four interactions
        env:
          ATLAS_P2C_EVIDENCE_DIR: ${{ runner.temp }}/p2c-browser
          ATLAS_P2C_PREVIEW_URL: http://127.0.0.1:8765/
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/p2c-viewer" >"$RUNNER_TEMP/p2c-server.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/atlas-gateway-production/p2c_browser_probe.mjs
      - name: Preserve 3D preview and real-browser evidence (no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-p2c-private-preview-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/p2c-viewer/
            ${{ runner.temp }}/p2c-browser/
            ${{ runner.temp }}/p2c-server.log
          if-no-files-found: warn
          retention-days: 30
# No root URL change, publication permissions, or deploy.
