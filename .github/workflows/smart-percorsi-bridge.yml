name: SMART Percorsi Bridge
on:
  pull_request:
    paths:
      - 'docs/contracts/SMART-PERCORSI-BRIDGE-01.md'
      - 'schemas/smart-percorsi-handoff.schema.json'
      - 'scripts/build-smart-percorsi-handoff.mjs'
      - 'scripts/test-smart-percorsi-handoff.mjs'
      - 'scripts/validate-smart-percorsi-handoff-schema.mjs'
      - '.github/workflows/smart-percorsi-bridge.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run adversarial bridge tests
        run: node scripts/test-smart-percorsi-handoff.mjs
      - name: Create isolated schema-validator lockfile
        run: |
          rm -rf .smart-percorsi-bridge-audit
          mkdir .smart-percorsi-bridge-audit
          printf '%s\n' '{"name":"smart-percorsi-bridge-audit","version":"1.0.0","private":true}' > .smart-percorsi-bridge-audit/package.json
          npm install --prefix .smart-percorsi-bridge-audit --package-lock-only --ignore-scripts ajv@8 ajv-formats@3
      - name: Install isolated schema validator
        run: npm ci --prefix .smart-percorsi-bridge-audit --ignore-scripts
      - name: Enforce schema on real builder output
        env:
          NODE_PATH: ${{ github.workspace }}/.smart-percorsi-bridge-audit/node_modules
        run: node scripts/validate-smart-percorsi-handoff-schema.mjs
