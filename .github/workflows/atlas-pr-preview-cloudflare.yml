name: Atlas Preview — Cloudflare Direct Upload

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful Atlas PR Preview Artifact run ID"
        required: true
      exact_head:
        description: "Full 40-character Git commit SHA bound to the artifact"
        required: true
      smoke_path:
        description: "Root-relative route that must be reachable after deploy"
        required: false
        default: "/percorsi/lab/pw-missing-information-01/"

permissions:
  actions: read
  contents: read

env:
  GOVERNED_WORKFLOW_ID: "367514449"
  GOVERNED_WORKFLOW_PATH: .github/workflows/atlas-pr-preview.yml
  CLOUDFLARE_PROJECT_NAME: atlas-pr-preview

concurrency:
  group: atlas-pr-preview-cloudflare
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: atlas-pr-preview
    steps:
      - name: Checkout governed deployment adapter
        uses: actions/checkout@v4

      - name: Validate source-run provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          EXPECTED_EXACT_HEAD: ${{ inputs.exact_head }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "exact_head must be a lowercase full Git SHA" >&2; exit 1; }
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "artifact_run_id must be numeric" >&2; exit 1; }
          RUN_JSON="$(gh api "repos/$REPOSITORY/actions/runs/$ARTIFACT_RUN_ID")"
          test "$(jq -r '.workflow_id' <<<"$RUN_JSON")" = "$GOVERNED_WORKFLOW_ID"
          test "$(jq -r '.path' <<<"$RUN_JSON")" = "$GOVERNED_WORKFLOW_PATH"
          test "$(jq -r '.name' <<<"$RUN_JSON")" = "Atlas PR Preview Artifact"
          test "$(jq -r '.event' <<<"$RUN_JSON")" = "workflow_dispatch"
          test "$(jq -r '.status' <<<"$RUN_JSON")" = "completed"
          test "$(jq -r '.conclusion' <<<"$RUN_JSON")" = "success"

      - name: Download validated exact-head artifact
        uses: actions/download-artifact@v5
        with:
          name: atlas-pr-preview-${{ inputs.exact_head }}
          path: preview
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact-head binding and authorization boundary
        shell: bash
        env:
          EXPECTED_EXACT_HEAD: ${{ inputs.exact_head }}
        run: |
          set -euo pipefail
          node scripts/validate-atlas-preview-contract.mjs preview "$EXPECTED_EXACT_HEAD"

      - name: Verify requested route exists in artifact
        shell: bash
        env:
          SMOKE_PATH: ${{ inputs.smoke_path }}
        run: |
          set -euo pipefail
          [[ "$SMOKE_PATH" == /* ]] || { echo "smoke_path must be root-relative" >&2; exit 1; }
          CLEAN="${SMOKE_PATH#/}"
          CLEAN="${CLEAN%/}"
          test -n "$CLEAN" || { echo "smoke_path cannot be root" >&2; exit 1; }
          test -f "preview/$CLEAN/index.html" || {
            echo "artifact does not contain preview/$CLEAN/index.html" >&2
            find preview -maxdepth 5 -type f | sort | head -200
            exit 1
          }

      - name: Verify failure-mode contract without deployment
        shell: bash
        env:
          EXPECTED_EXACT_HEAD: ${{ inputs.exact_head }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp preview/EXACT_HEAD.txt preview/PREVIEW-MANIFEST.json "$tmp/"
          if node scripts/validate-atlas-preview-contract.mjs "$tmp" "0000000000000000000000000000000000000000"; then
            echo "validator accepted mismatched exact head" >&2
            exit 1
          fi
          node - "$tmp/PREVIEW-MANIFEST.json" <<'NODE'
          const fs = require('fs');
          const p = process.argv[2];
          const m = JSON.parse(fs.readFileSync(p, 'utf8'));
          m.studentAuthorized = true;
          fs.writeFileSync(p, JSON.stringify(m));
          NODE
          if node scripts/validate-atlas-preview-contract.mjs "$tmp" "$EXPECTED_EXACT_HEAD"; then
            echo "validator accepted studentAuthorized=true" >&2
            exit 1
          fi
          : > "$tmp/PREVIEW-MANIFEST.json"
          if node scripts/validate-atlas-preview-contract.mjs "$tmp" "$EXPECTED_EXACT_HEAD"; then
            echo "validator accepted invalid manifest" >&2
            exit 1
          fi

      - name: Validate Cloudflare credentials before upload
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID missing" >&2; exit 1; }

      - name: Deploy validated artifact to Cloudflare Pages preview
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_EXACT_HEAD: ${{ inputs.exact_head }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/wrangler-pages-deploy.log"
          npx --yes wrangler@latest pages deploy preview \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch="g1-${EXPECTED_EXACT_HEAD:0:12}" \
            --commit-hash="$EXPECTED_EXACT_HEAD" \
            --commit-message="Atlas G1 exact-head $EXPECTED_EXACT_HEAD — NOT_RUNTIME_AUTHORIZED" | tee "$LOG"
          DEPLOYMENT_URL="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' "$LOG" | tail -1)"
          test -n "$DEPLOYMENT_URL" || { echo "Cloudflare deployment URL not found in Wrangler output" >&2; exit 1; }
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed exact head and route
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          EXPECTED_EXACT_HEAD: ${{ inputs.exact_head }}
          SMOKE_PATH: ${{ inputs.smoke_path }}
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl --fail --silent --show-error "$DEPLOYMENT_URL/EXACT_HEAD.txt" -o "$RUNNER_TEMP/deployed-head.txt" && \
               curl --fail --silent --show-error "$DEPLOYMENT_URL$SMOKE_PATH" -o "$RUNNER_TEMP/smoke.html"; then
              break
            fi
            test "$i" -lt 12 || { echo "deployed preview never became healthy" >&2; exit 1; }
            sleep 5
          done
          DEPLOYED_HEAD="$(tr -d '\r\n' < "$RUNNER_TEMP/deployed-head.txt")"
          test "$DEPLOYED_HEAD" = "$EXPECTED_EXACT_HEAD" || {
            echo "deployed EXACT_HEAD.txt mismatch: $DEPLOYED_HEAD" >&2
            exit 1
          }
          test -s "$RUNNER_TEMP/smoke.html" || { echo "smoke route returned an empty document" >&2; exit 1; }

      - name: Record governance boundary
        shell: bash
        env:
          EXPECTED_EXACT_HEAD: ${{ inputs.exact_head }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          SMOKE_PATH: ${{ inputs.smoke_path }}
        run: |
          {
            echo "### Atlas Cloudflare Preview"
            echo "Exact head: \`$EXPECTED_EXACT_HEAD\`"
            echo "Student authorized: **false**"
            echo "Channel: preview only"
            echo "Deployment: $DEPLOYMENT_URL"
            echo "Verified route: $DEPLOYMENT_URL$SMOKE_PATH"
          } >> "$GITHUB_STEP_SUMMARY"

# This workflow deploys only a validated static artifact to a Cloudflare Pages preview branch.
# Candidate identity is proven by the artifact name plus EXACT_HEAD.txt/PREVIEW-MANIFEST.json validation;
# the workflow-dispatch run itself is intentionally anchored to the governed main revision.
# A successful run also proves HTTP reachability of the requested route.
# It does not publish canonical Atlas, merge the candidate, or authorize student use.
