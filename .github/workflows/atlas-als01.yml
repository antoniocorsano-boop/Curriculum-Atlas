name: Atlas — ALS-01 reusable astral light
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/atlas-als01.yml"
      - "scripts/als01/**"
      - "docs/atlas-gateway/ALS-01.md"
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-als01
  cancel-in-progress: true
jobs:
  pilot:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.head.ref == 'work/atlas-als01-astral-light' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check and test reusable profiles
        run: |
          node --check scripts/als01/core.mjs
          node --check scripts/als01/three-adapter.mjs
          node --check scripts/als01/test-webgl.mjs
          node scripts/als01/core.test.mjs
      - name: Install existing application dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Recover exact R2 model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/als-r2"
          cd "$RUNNER_TEMP/als-r2"
          curl --fail --silent --show-error --location --max-time 120 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14416938462/zip" -o r2.zip
          echo '84f1786ee98dac231f0d8fde0dd34bd1d1724f7ef707c1257b4fc824f3ade3ed  r2.zip' | sha256sum --strict --check
          unzip -p r2.zip four-stars.glb > four-stars.glb
          unzip -p r2.zip receipt.json > receipt.json
          echo '684849b72dfc3314c6383e3a0864fa244145811f3d27fb9bdc76d7fbfd7f92e0  four-stars.glb' | sha256sum --strict --check
      - name: Inspect actual R2 with ALS-01 in six viewports
        run: node scripts/als01/test-webgl.mjs "$RUNNER_TEMP/als-r2" "$RUNNER_TEMP/als01-evidence"
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-als01-webgl
          path: ${{ runner.temp }}/als01-evidence/
          if-no-files-found: warn
          retention-days: 7
