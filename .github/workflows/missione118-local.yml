name: M118-R1 - Local standalone experience
on:
  pull_request:
    branches: [feat/missione-118-activity-intake]
    paths:
      - "scripts/build-missione118-runtime.mjs"
      - "scripts/test-missione118-local.mjs"
      - "scripts/missione118-local-progress.mjs"
      - "scripts/test-missione118-progress.mjs"
      - "content/staging/missione-118/**"
      - ".github/workflows/missione118-local.yml"
permissions:
  contents: read
jobs:
  offline-browser:
    if: github.event.repository.private == false && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/missione-118-runtime-local'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify original intake and build standalone draft
        run: |
          node scripts/validate-activity-intake.mjs content/staging/missione-118/intake.json
          node scripts/build-missione118-runtime.mjs
      - name: Install existing browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/m118-test" --no-audit --no-fund --save-exact playwright@1.55.0
          "$RUNNER_TEMP/m118-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real offline browser desktop and mobile viewport
        run: |
          cp scripts/test-missione118-local.mjs "$RUNNER_TEMP/m118-test/test.mjs"
          node "$RUNNER_TEMP/m118-test/test.mjs"
          cp scripts/test-missione118-progress.mjs "$RUNNER_TEMP/m118-test/progress.mjs"
          node "$RUNNER_TEMP/m118-test/progress.mjs"
      - name: Preserve local candidate only after test
        uses: actions/upload-artifact@v4
        with:
          name: missione118-local-r2
          path: artifacts/missione118-runtime/
          retention-days: 7
