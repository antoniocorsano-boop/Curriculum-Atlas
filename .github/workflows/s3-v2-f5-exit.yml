name: R3-F0 S3-V2 F5 Exit

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/s3-v2-exit-check.mjs"
      - "docs/S3-V2-F5-EXIT.md"
      - "README.md"
      - "package.json"
      - ".github/workflows/s3-v2-f5-exit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validate public materials
        run: pnpm validate:materials

      - name: Image normalization self-test
        run: pnpm normalize:image:selftest

      - name: Build
        run: pnpm build

      - name: Start app
        shell: bash
        run: |
          set -euo pipefail
          pnpm start > /tmp/atlas-f5.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/atlas-f5.log
          exit 1

      - name: Run S3-V2 exit checks
        run: node scripts/s3-v2-exit-check.mjs
