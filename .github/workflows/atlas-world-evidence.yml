name: Atlas — AWC-B/C evidence and composition
on:
  pull_request:
    paths:
      - 'ops/atlas-scene-package/awc-evidence-index.json'
      - 'ops/atlas-scene-package/awc-catalog.json'
      - 'scripts/atlas-world-evidence.py'
      - 'scripts/test-atlas-world-evidence.py'
      - 'scripts/atlas-world-catalog.py'
      - 'scripts/atlas-world-compose.py'
      - 'scripts/test-atlas-world-compose.py'
      - 'scripts/scene-director.py'
      - 'scripts/atlas-scene-compiler-plan.py'
      - 'ops/atlas-scene-director/parameters.json'
      - 'ops/atlas-scene-package/asc01-production-policy.json'
      - 'ops/atlas-scene-package/editable-master-receipt-summary.json'
      - '.github/workflows/atlas-world-evidence.yml'
      - 'docs/atlas-gateway/ASC-01-AWC-CONSOLIDAMENTO.md'
permissions:
  contents: read
  actions: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate source catalog and observations without execution
        run: |
          python3 scripts/test-atlas-world-catalog.py
          python3 scripts/test-atlas-world-evidence.py
          python3 scripts/atlas-world-evidence.py
          python3 scripts/test-atlas-world-compose.py
          python3 scripts/atlas-world-compose.py --example native
          python3 scripts/atlas-world-compose.py --example blender
  replay:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'work/asc-world-composer-consolidation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Recover exact producer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/awc-evidence"
          mkdir -p "$p"
          python3 - <<'PY' > "$p/manifest.tsv"
          import json
          a=json.load(open("ops/atlas-scene-package/awc-evidence-index.json"))["archives"]
          for k,v in sorted(a.items()):
              print(v["artifact"],v["sha256"])
          PY
          while read -r id sha; do
            curl --fail --silent --show-error --location --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$p/$id.zip"
            printf '%s  %s\n' "$sha" "$p/$id.zip" | sha256sum --strict --check
          done < "$p/manifest.tsv"
      - name: Replay all observed facts and producer lineage
        run: python3 scripts/atlas-world-evidence.py --archives "$RUNNER_TEMP/awc-evidence" --report "$RUNNER_TEMP/awc-evidence-report.json"
      - name: Compose bay plan from independently replayed observations
        run: |
          python3 scripts/atlas-world-compose.py --example bay --archives "$RUNNER_TEMP/awc-evidence" --report "$RUNNER_TEMP/awc-composition-plan.json"
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])
          a=json.loads((p/"awc-evidence-report.json").read_text())
          b=json.loads((p/"awc-composition-plan.json").read_text())
          assert a["status"]=="PASS_AWC_B_EVIDENCE_REPLAY" and a["archiveReplay"]
          assert b["archiveReplay"] and b["mode"]=="PLAN_ONLY" and not b["readyForExecution"]
          assert b["target"]=="webgl" and b["context"]=="bay-preview"
          assert b["geometryComparison"]["observedTriangles"]==19008
          assert [s["id"] for s in b["steps"]]==["library.agx.display","library.walnut.microstructure","library.walnut.lightmap","library.bay.navigation"]
          for step in b["steps"]:
              assert step["facts"]==a["observations"][step["id"]]
              assert step["mode"]=="REFERENCE_ONLY"
          assert not any(b["authority"].values()) and not b["rendererExecutionAuthorized"] and not b["toolExecutionAuthorized"]
          h=b.pop("planSha256")
          assert h==hashlib.sha256(json.dumps(b,sort_keys=True,separators=(",",":"),ensure_ascii=False,allow_nan=False).encode()).hexdigest()
          print("PASS_AWC_C_COMPOSITION_REPLAY")
          PY
      - name: Preserve derived receipts only
        uses: actions/upload-artifact@v4
        with:
          name: atlas-awc-b-evidence
          path: |
            ${{ runner.temp }}/awc-evidence-report.json
            ${{ runner.temp }}/awc-composition-plan.json
          retention-days: 7
          if-no-files-found: error
