name: Arena Curriculum Authority Gate

on:
  pull_request:
    paths:
      - "src/features/curriculum/arena-curriculum-export.json"
      - "src/features/curriculum/fixtures.ts"
      - "scripts/sync-arena-curriculum.mjs"
      - "scripts/validate-arena-curriculum-authority.mjs"
      - ".github/workflows/arena-curriculum-*.yml"

permissions:
  contents: read

jobs:
  candidate:
    name: Arena curriculum candidate integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/validate-arena-curriculum-authority.mjs --candidate-only

  publication-authority:
    name: Arena curriculum publication authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/validate-arena-curriculum-authority.mjs
