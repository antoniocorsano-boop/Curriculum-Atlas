name: Atlas — ASC-01 P2C1 light transfer
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/atlas-scene-compiler-light-transfer.py'
      - '.github/workflows/atlas-scene-compiler-light-transfer.yml'
      - 'docs/atlas-gateway/ASC-01-P2C1-LUCE-VISIBILE.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-asc-p2c1-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  bake-export:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'work/atlas-production-standard-p2c1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ATLAS_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify pinned Blender and syntax
        run: |
          bash scripts/atlas-gateway-c3/bootstrap-blender.sh
          python3 -m py_compile scripts/atlas-scene-compiler-light-transfer.py
      - name: Recover exact master and three receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-p2c1-input"
          mkdir -p "$p" "$RUNNER_TEMP/asc-p2c1-evidence"
          for spec in "14444143410 c7154de191cb6d25890a2881f470f6d6eeba74b2dcab897842f4753403e685c6 master" "14532419098 d9265cc68d178b2eec7f5f8655cacf5ce6631fdc5afd99267b715e5660ecbfde p1" "14534077838 c37b3b289d6c4335a26e1139823e7134831a54ac53f98684cef05953838bb45e p2a" "14535186361 dd4d39defc5b5395ba13a34a2ef98606a7f88acf049efbb949bd2ab7b52fa2f0 p2b"; do
            read -r id sha name <<< "$spec"
            curl --fail --silent --show-error --location --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$p/$name.zip"
            printf '%s  %s\n' "$sha" "$p/$name.zip" | sha256sum --strict --check
          done
          unzip -p "$p/master.zip" Atlas-Scene-Master.blend > "$p/Atlas-Scene-Master.blend"
          unzip -p "$p/p1.zip" asc-p1-baseline.json > "$p/asc-p1-baseline.json"
          unzip -p "$p/p2a.zip" page-ablation.json > "$p/page-ablation.json"
          unzip -p "$p/p2b.zip" page-extension.json > "$p/page-extension.json"
          printf '%s  %s\n' f216e3158c055de0990cd5f36ce388fe4731847fce12f2c42619b03806b9c3ab "$p/Atlas-Scene-Master.blend" | sha256sum --strict --check
          chmod a-w "$p/Atlas-Scene-Master.blend" "$p/asc-p1-baseline.json" "$p/page-ablation.json" "$p/page-extension.json"
      - name: Bake real visible surface and export self-contained GLB
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-p2c1-input"
          out="$RUNNER_TEMP/asc-p2c1-evidence"
          timeout 1800 "$BLENDER_BIN" --background --factory-startup --disable-autoexec "$p/Atlas-Scene-Master.blend" --python-exit-code 1 --python scripts/atlas-scene-compiler-light-transfer.py -- "$p/Atlas-Scene-Master.blend" "$p/asc-p1-baseline.json" "$p/page-ablation.json" "$p/page-extension.json" "$out" 2>&1 | tee "$out/run.log"
      - name: Validate lighting, material, UV and restoration
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"asc-p2c1-evidence"
          r=json.loads((p/"light-transfer.json").read_text())
          assert r["status"]=="PASS_ISOLATED_BAKE_AND_GLTF" and r["revision"]==os.environ["ATLAS_EXACT_HEAD"]
          assert r["masterUnchanged"] and r["sourceBindingsRestored"]
          assert r["surface"]["firstVisibleRays"]>0 and r["surface"]["sampledRays"]==6144
          assert r["bake"]["uv"]["overlapPixelsAt256"]==0 and r["bake"]["uv"]["coveredPixelsAt256"]>0
          assert r["export"]["embeddedImages"]>=1 and 1 in r["export"]["textureCoordinateSets"]
          assert "TEXCOORD_1" in r["export"]["primitiveAttributes"]
          assert set(r["images"])=={"context-original","context-baked","context-restored","atrium-original","atrium-baked"}
          for key,v in r["images"].items():
              assert hashlib.sha256((p/(key+".png")).read_bytes()).hexdigest()==v["sha256"]
          assert hashlib.sha256((p/"lightmap-512.png").read_bytes()).hexdigest()==r["bake"]["pngSha256"]
          assert hashlib.sha256((p/"single-surface-baked.glb").read_bytes()).hexdigest()==r["export"]["sha256"]
          assert r["comparisons"]["context-restored"]["meanAbsoluteRGBDelta"]<.0002
          assert not any(r[k] for k in ("masterModified","rendererModified","studentAuthorized","publishable","artisticApproval","webglQualified"))
          print("ASC-P2C1 isolated bake and GLB verified; browser and artistic qualification pending.")
          PY
      - name: Preserve actual bake, GLB, images and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-asc-p2c1-light-transfer
          path: ${{ runner.temp }}/asc-p2c1-evidence/
          retention-days: 7
          if-no-files-found: warn
