name: Atlas — ASC-01 P2C3B microstructure ablation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/atlas-scene-compiler-diffuse-bake.py'
      - 'scripts/atlas_linear_texture_contract.py'
      - 'scripts/atlas_material_ablation.py'
      - 'scripts/atlas_microstructure_ablation.py'
      - 'scripts/verify-atlas-microstructure-ablation.py'
      - 'scripts/verify-atlas-material-ablation.py'
      - '.github/workflows/atlas-scene-compiler-microstructure.yml'
      - 'docs/atlas-gateway/ASC-01-P2C3-MICROSTRUCTURE.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-asc-p2c3b-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  bake:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'work/atlas-production-standard-p2c3-microstructure' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ATLAS_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Replay historical material evidence before rendering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-material-replay"
          mkdir -p "$p/evidence"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14546470019/zip" -o "$p/prior.zip"
          printf '%s  %s\n' f123179e64368ccd39190f4c6b46626dda07a3000e72010db840b4d3f2e3c800 "$p/prior.zip" | sha256sum --strict --check
          for name in diffuse-bake.json material-ablation.json canary-linear.exr diffuse-linear.exr native-baseline.png native-baked-preview.png native-restored.png material-control.png material-diffuse-camera.png material-hybrid-camera.png; do
            unzip -p "$p/prior.zip" "$name" > "$p/evidence/$name"
          done
          python3 scripts/verify-atlas-material-ablation.py "$p/evidence" 2370c44f202185e4aebf7a2fa13aa63b6b1f7a10
          echo "Historical P2C3A receipt replay passed."
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify pinned Blender and syntax
        run: |
          bash scripts/atlas-gateway-c3/bootstrap-blender.sh
          python3 -m py_compile scripts/atlas-scene-compiler-diffuse-bake.py scripts/atlas_linear_texture_contract.py scripts/atlas_material_ablation.py scripts/verify-atlas-material-ablation.py scripts/atlas_microstructure_ablation.py scripts/verify-atlas-microstructure-ablation.py
      - name: Recover exact immutable inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-p2c-input"
          mkdir -p "$p" "$RUNNER_TEMP/asc-p2c-evidence"
          for spec in "14444143410 c7154de191cb6d25890a2881f470f6d6eeba74b2dcab897842f4753403e685c6 master" "14534077838 c37b3b289d6c4335a26e1139823e7134831a54ac53f98684cef05953838bb45e p2a" "14535186361 dd4d39defc5b5395ba13a34a2ef98606a7f88acf049efbb949bd2ab7b52fa2f0 p2b" "14541319689 d1abd91c141ff35286d2ec005bcdf2a6556126aedcc29040b38e4ba5957fb225 context" "14542299308 0e27ddcfed94a39be33af84862318e29111a129ad7acc2b1f94af56c8c6acfb8 live"; do
            read -r id sha name <<< "$spec"
            curl --fail --silent --show-error --location --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$p/$name.zip"
            printf '%s  %s\n' "$sha" "$p/$name.zip" | sha256sum --strict --check
          done
          unzip -p "$p/master.zip" Atlas-Scene-Master.blend > "$p/Atlas-Scene-Master.blend"
          unzip -p "$p/p2a.zip" page-ablation.json > "$p/page-ablation.json"
          unzip -p "$p/p2b.zip" page-extension.json > "$p/page-extension.json"
          printf '%s  %s\n' f216e3158c055de0990cd5f36ce388fe4731847fce12f2c42619b03806b9c3ab "$p/Atlas-Scene-Master.blend" | sha256sum --strict --check
          unzip -p "$p/context.zip" context-oracle.json > "$p/context-oracle.json"
          unzip -p "$p/live.zip" live-agx-reference.json > "$p/live-agx-reference.json"
          printf '%s  %s\n' 8bfb116e9e580c9c66a5601f79acf799f66ffa17b986e157486d102331e56973 "$p/context-oracle.json" | sha256sum --strict --check
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"asc-p2c-input"
          r=json.loads((p/"live-agx-reference.json").read_text())
          assert r["revision"]=="89c5a2556e86ad311c3b89a70fdd05ff7f5ba8e9" and r["status"]=="PASS_LIVE_AGX_REFERENCE" and r["masterUnchanged"]
          PY
          chmod a-w "$p/Atlas-Scene-Master.blend" "$p/"*.json
      - name: Render controlled microstructure factorial comparisons
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-p2c-input"
          out="$RUNNER_TEMP/asc-p2c-evidence"
          export ATLAS_P2C3_ORACLE="$p/context-oracle.json"
          export ATLAS_P2C3_MICROSTRUCTURE=1
          timeout 3900 "$BLENDER_BIN" --background --factory-startup --disable-autoexec "$p/Atlas-Scene-Master.blend" --python-exit-code 1 --python scripts/atlas-scene-compiler-diffuse-bake.py -- "$p/Atlas-Scene-Master.blend" "$p/page-ablation.json" "$p/page-extension.json" "$out" 2>&1 | tee "$out/run.log"
      - name: Verify linear texture receipt and rollback
        run: |
          python3 scripts/verify-atlas-material-ablation.py "$RUNNER_TEMP/asc-p2c-evidence" "$ATLAS_EXACT_HEAD" --microstructure
          python3 scripts/verify-atlas-microstructure-ablation.py "$RUNNER_TEMP/asc-p2c-evidence" "$ATLAS_EXACT_HEAD"
      - name: Preserve bake and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-asc-p2c3b-microstructure
          path: ${{ runner.temp }}/asc-p2c-evidence/
          retention-days: 7
          if-no-files-found: warn
