name: ATLAS P2 — Tre composizioni architettoniche reali
on:
  push:
    branches: [work/atlas-artdir02-p2-composizioni-01]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-p2-compositions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p2-three-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify script syntax
        run: python3 -m py_compile scripts/atlas-gateway-production/p2_three_compositions_01.py
      - name: Recover REAL P1F/ROOF-02 qualified editable .blend
        uses: actions/download-artifact@v4
        with:
          run-id: 45062409931
          pattern: atlas-p1f-pavilion-roof02-*
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/parent
      - name: Verify exact original, topology and unpublished state
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"parent"
          r=json.loads((p/"atlas-p1f-pavilion-roof02-receipt.json").read_text())
          f=p/"atlas-p1f-pavilion-roof02-editable.blend"
          assert r["schema"]=="atlas.artdir02.p1f-roof-pavilion-02/v1"
          assert r["canonical_art_sha256"]=="a132a9e188b6b931d078a6f016450f3e9a03153de665f72a486816035ea830fe"
          assert hashlib.sha256(f.read_bytes()).hexdigest()==r["files"]["blend"]["sha256"]
          assert r["single_roof_mesh_closed"]["connected"]
          assert r["single_roof_mesh_closed"]["nonmanifold_edges"]==0
          assert r["four_glass_portals_geometry_preserved"]
          assert not r["art_approved"] and not r["web_approved"]
          assert r["no_merge"] and r["no_deploy"]
          print("P2_PARENT_SHA_AND_PROVENANCE_VERIFIED",f.stat().st_size)
          PY
      - name: Install actual Blender and Cycles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends blender python3-numpy
      - name: Reuse the exact previously qualified P2 A/B/C source artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 45072225793
          pattern: atlas-p2-three-compositions-4
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p2
      - name: Pin P2 provenance, original renderer files and no-change constraint
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"p2"
          r=json.loads((p/"atlas-p2-three-compositions-receipt.json").read_text())
          assert r["schema"]=="atlas.artdir02.p2-compositions-01/v1"
          assert set(r["profiles"])=={"A","B","C"}
          assert r["original_art_reference_sha256"]=="a132a9e188b6b931d078a6f016450f3e9a03153de665f72a486816035ea830fe"
          assert r["source_binary_unchanged"] and r["three_distinct_approaches"]
          assert not r["art_approved"] and not r["web_approved"]
          for profile in r["profiles"].values():
              for meta in profile["files"].values():
                  file=p/meta["name"]
                  assert file.stat().st_size==meta["bytes"]
                  assert hashlib.sha256(file.read_bytes()).hexdigest()==meta["sha256"]
          print("P2_IMMUTABLE_SOURCE_ABC_REUSED_AND_VERIFIED")
          PY
      - name: Audit outputs, exact SHA, four portals and no-publication constraints
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"p2"
          r=json.loads((p/"atlas-p2-three-compositions-receipt.json").read_text())
          assert r["schema"]=="atlas.artdir02.p2-compositions-01/v1"
          assert r["original_art_reference_sha256"]=="a132a9e188b6b931d078a6f016450f3e9a03153de665f72a486816035ea830fe"
          assert r["source_binary_unchanged"] and r["source_existing_model"]
          assert r["three_distinct_approaches"] and set(r["profiles"])=={"A","B","C"}
          assert r["no_merge"] and r["no_deploy"] and r["no_student_data"]
          assert not r["art_approved"] and not r["web_approved"]
          for key,v in r["profiles"].items():
              assert v["portal_arc_camera_side"],key
              assert len(v["portals"])==4 and len(v["portal_projected_centres"])==4,key
              assert len(v["upper_elements_raised"])>=1,key
              assert v["three_levels"]["first_gallery"]!=v["three_levels"]["upper_gallery"]
              assert not v["legacy_floor_cuts_verified_at_new_positions"]
              for name,f in v["files"].items():
                  q=p/f["name"]
                  assert q.exists(),(key,name)
                  assert q.stat().st_size==f["bytes"],(key,name)
                  assert hashlib.sha256(q.read_bytes()).hexdigest()==f["sha256"],(key,name)
          report=("# ATLAS P2 — Composizioni A/B/C\n\n"
                  "Tre rendering Cycles e tre file Blender modificabili, derivati dal "
                  "file P1F/ROOF-02 autenticato.\n\n"
                  "| Variante | Profilo | Posizione portali | Stato |\n"
                  "|---|---|---|---|\n"
                  "| A | Monumentale | Semicerchio anteriore | Da valutare |\n"
                  "| B | Equilibrata | Semicerchio anteriore | Da valutare |\n"
                  "| C | Scenografica | Semicerchio anteriore | Da valutare |\n\n"
                  "**Restano aperti**: confronto artistico, ripristino delle feritoie "
                  "fisiche nelle nuove posizioni, verifica mobile e approvazione umana.\n\n"
                  "**Nessun merge o deploy.**\n")
          (p/"ATLAS-P2-REPORT.md").write_text(report,encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(report)
          print("ATLAS_P2_THREE_AUTHENTIC_SCENES_PASS")
          PY
      - name: Check the selected A art-direction script
        run: python3 -m py_compile scripts/atlas-gateway-production/p2a_art_direction_final_01.py
      - name: Create a single A Monumentale refined editable scene and genuine Cycles render
        run: |
          mkdir -p "$RUNNER_TEMP/p2a"
          blender -b "$RUNNER_TEMP/p2/atlas-p2-A-monumentale.blend" \
            --threads 2 --python-exit-code 1 \
            --python scripts/atlas-gateway-production/p2a_art_direction_final_01.py -- \
            --parent-receipt "$RUNNER_TEMP/p2/atlas-p2-three-compositions-receipt.json" \
            --out "$RUNNER_TEMP/p2a"
      - name: Independently verify P2A files, geometry, exact SHAs, and safety states
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"p2a"
          r=json.loads((p/"atlas-p2a-art-direction-receipt.json").read_text())
          assert r["schema"]=="atlas.artdir02.p2a-art-direction-01/v1"
          assert r["canonical_art_sha256"]=="a132a9e188b6b931d078a6f016450f3e9a03153de665f72a486816035ea830fe"
          assert r["parent_preserved"] and r["alternative_B_C_preserved"]
          assert r["selected_candidate"]=="A Monumentale"
          assert r["floor_real_boolean"] and r["floor_faces_before"]!=r["floor_faces_after"]
          assert r["three_levels_preserved"] and r["original_skylight_mesh_preserved"]
          assert len(r["portal_targets"])==4 and len(r["portal_frames"])==4
          assert len([x for x in r["disabled_opaque_backings"] if "retro" in x.lower()])==4
          assert len(r["portal_original_mesh_inventory"])==4
          assert len(r["rebalance_gallery_objects"])>=4
          assert all(x["camera_side"] and abs(x["screen_target"]-x["screen_x"])<.03 for x in r["portal_targets"])
          assert not r["art_approved"] and not r["web_approved"]
          assert r["no_merge"] and r["no_deploy"]
          for record in r["files"].values():
              file=p/record["name"]
              assert file.exists() and file.stat().st_size==record["bytes"]
              assert hashlib.sha256(file.read_bytes()).hexdigest()==record["sha256"]
          original=Path(os.environ["RUNNER_TEMP"])/"p2"/"atlas-p2-A-monumentale.blend"
          assert hashlib.sha256(original.read_bytes()).hexdigest()==r["parent_p2_A_blend_sha256"]
          print("ATLAS_P2A_SINGLE_REFINED_REAL_SCENE_PASS")
          PY
      - name: Verify P2B material finishing script syntax
        run: python3 -m py_compile scripts/atlas-gateway-production/p2b_material_finish_01.py
      - name: Finish material, light and reflection on already approved A geometry
        run: |
          mkdir -p "$RUNNER_TEMP/p2b"
          blender -b "$RUNNER_TEMP/p2a/atlas-p2-A-monumentale-final-candidate.blend" \
            --threads 2 --python-exit-code 1 \
            --python scripts/atlas-gateway-production/p2b_material_finish_01.py -- \
            --parent-receipt "$RUNNER_TEMP/p2a/atlas-p2a-art-direction-receipt.json" \
            --out "$RUNNER_TEMP/p2b"
      - name: Independently audit unchanged geometry, finishes and receipts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          base=Path(os.environ["RUNNER_TEMP"])
          p=base/"p2b"
          r=json.loads((p/"atlas-p2b-materials-receipt.json").read_text())
          parent=json.loads((base/"p2a"/"atlas-p2a-art-direction-receipt.json").read_text())
          assert r["schema"]=="atlas.artdir02.p2b-material-finish-01/v1"
          assert r["approved_architectural_source"]=="P2A/R4 A Monumentale"
          assert r["reference_sha256"]=="a132a9e188b6b931d078a6f016450f3e9a03153de665f72a486816035ea830fe"
          assert r["source_binary_unchanged"] and r["original_objects_unchanged"]
          assert r["source_p2a_blend_sha256"]==parent["files"]["blend"]["sha256"]
          assert r["original_objects_count"]>100 and len(r["original_spatial_fingerprint_sha256"])==64
          assert len(r["new_objects_only_lights"])==2 and len(r["certified_portals"])==4
          assert r["floor_cuts_preserved"] and r["three_levels"]
          assert r["art_direction_approved"] and not r["art_final_approved"]
          assert not r["web_approved"] and not r["student_publication_approved"]
          assert r["no_merge"] and r["no_deploy"]
          for meta in r["files"].values():
              f=p/meta["name"]
              assert f.is_file() and f.stat().st_size==meta["bytes"]
              assert hashlib.sha256(f.read_bytes()).hexdigest()==meta["sha256"]
          print("ATLAS_P2B_MATERIALS_LUMEN_GEOMETRY_FROZEN_PASS")
          PY
      - name: Preserve P2B genuine Cycles finish and editable Blender
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-p2b-material-finish-${{ github.run_number }}
          path: ${{ runner.temp }}/p2b/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve P2A authentic refined A and qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-p2a-art-direction-${{ github.run_number }}
          path: ${{ runner.temp }}/p2a/
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve outputs and full receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-p2-three-compositions-${{ github.run_number }}
          path: ${{ runner.temp }}/p2/
          if-no-files-found: warn
          retention-days: 30
