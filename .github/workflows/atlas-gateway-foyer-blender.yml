name: Atlas Visual Factory 3D — master Blender
on:
  push:
    branches: [work/atlas-gateway-01-foyer]
    paths:
      - "scripts/atlas-gateway-foyer/blender_master.py"
      - ".github/workflows/atlas-gateway-foyer-blender.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce-3d-master:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Python source syntax
        run: python3 -m py_compile scripts/atlas-gateway-foyer/blender_master.py
      - name: Install open-source Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends blender
          blender --version | head -2
      - name: Produce original Blender master, GLB and reference render
        run: |
          mkdir -p "$RUNNER_TEMP/atlas-foyer-master"
          blender --background --factory-startup --threads 2 --python scripts/atlas-gateway-foyer/blender_master.py -- --out "$RUNNER_TEMP/atlas-foyer-master"
      - name: Verify exported model and source evidence
        run: |
          python3 - "$RUNNER_TEMP/atlas-foyer-master" <<'PY'
          import sys, os, json, hashlib, struct
          root=sys.argv[1]
          with open(os.path.join(root,"source-receipt.json"),encoding="utf8") as f: r=json.load(f)
          assert r["schema"]=="atlas.visual-factory.foyer-source/v1"
          assert r["meshes"]>=30 and r["triangles_estimate"]>500
          assert r["has_student_data"] is False and r["student_authorized"] is False
          for name,entry in r["files"].items():
              file=os.path.join(root,name)
              data=open(file,"rb").read()
              assert len(data)==entry["bytes"] and hashlib.sha256(data).hexdigest()==entry["sha256"]
          data=open(os.path.join(root,"atlas-foyer-master.glb"),"rb").read()
          assert data[:4]==b"glTF"
          assert struct.unpack_from("<I",data,4)[0]==2
          assert struct.unpack_from("<I",data,8)[0]==len(data)
          assert struct.unpack_from("<I",data,16)[0]==0x4E4F534A
          size=struct.unpack_from("<I",data,12)[0]
          schema=json.loads(data[20:20+size].decode("utf8"))
          assert len(schema.get("meshes",[]))>=30
          assert not any("uri" in x for x in schema.get("buffers",[]))
          assert not any("uri" in x for x in schema.get("images",[]))
          print("ATLAS_FOYER_BLENDER_GLTF_PASS",r["meshes"],r["triangles_estimate"],len(data))
          PY
      - name: Archive editable master and exported resources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-gateway-visual-factory-master
          path: ${{ runner.temp }}/atlas-foyer-master/
          if-no-files-found: warn
          retention-days: 14
