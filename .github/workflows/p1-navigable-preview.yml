name: ATLAS-P1 Navigable Preview

on:
  push:
    branches:
      - work/p1-materials-hub-v1

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: atlas-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable S1 exact head
        uses: actions/checkout@v4
        with:
          ref: 85d7be34e28547c516d0d1f12fdefff1d262951d
          path: s1

      - name: Checkout current P1 exact head
        uses: actions/checkout@v4
        with:
          path: p1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build S1 root
        working-directory: s1
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Build P1 preview
        working-directory: p1
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          sed -i 's#<head>#<head><meta name="robots" content="noindex,nofollow">#' dist/index.html
          printf '%s\n' \
            "ATLAS-P1 navigable preview" \
            "sha=${GITHUB_SHA}" \
            "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist/PREVIEW_IDENTITY.txt

      - name: Assemble composite Pages site
        run: |
          mkdir -p site/p1-preview
          cp -a s1/dist/. site/
          cp -a p1/dist/. site/p1-preview/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy composite S1 + P1 preview
        id: deployment
        uses: actions/deploy-pages@v4
