name: Atlas — ART-LEARN-05D material refinement
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/art-learn-material-*.py'
      - '.github/workflows/atlas-art-learn-material.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-art-material-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  editorial:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'work/atlas-art-learn-05d-material' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ATLAS_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify pinned Blender
        run: bash scripts/atlas-gateway-c3/bootstrap-blender.sh
      - name: Verify Python syntax
        run: python3 -m py_compile scripts/art-learn-material-library.py
      - name: Recover exact qualified source library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/material-input"
          mkdir -p "$p" "$RUNNER_TEMP/material-evidence"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --max-time 120 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14523702251/zip" -o "$p/source.zip"
          printf '%s  %s\n' 240635f0a1e64e5f7b0dde2854c1adfab044bba88a480b6ac11776d1d0841eec "$p/source.zip" | sha256sum --strict --check
          unzip -p "$p/source.zip" Atlas-Editorial-Collection.blend > "$p/Atlas-Editorial-Collection.blend"
          unzip -p "$p/source.zip" editorial-study.json > "$p/editorial-study.json"
      - name: Refine original materials and render eleven paired studio images
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/material-input"
          out="$RUNNER_TEMP/material-evidence"
          timeout 1350 "$BLENDER_BIN" --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/art-learn-material-library.py -- "$p/Atlas-Editorial-Collection.blend" "$p/editorial-study.json" "$out" 2>&1 | tee "$out/render.log"
      - name: Append four new assets into an independent Blender project
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/material-evidence"
          timeout 120 "$BLENDER_BIN" --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/art-learn-material-library.py -- verify "$out/Atlas-Material-Collection.blend" "$out/material-study.json" 2>&1 | tee "$out/append.log"
      - name: Reopen with both candidate and original libraries unavailable
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/material-evidence"
          p="$RUNNER_TEMP/material-input"
          mv "$out/Atlas-Material-Collection.blend" "$RUNNER_TEMP/05d-hidden.blend"
          mv "$p/Atlas-Editorial-Collection.blend" "$RUNNER_TEMP/05d-source-hidden.blend"
          trap 'mv "$RUNNER_TEMP/05d-hidden.blend" "$out/Atlas-Material-Collection.blend"; mv "$RUNNER_TEMP/05d-source-hidden.blend" "$p/Atlas-Editorial-Collection.blend"' EXIT
          timeout 120 "$BLENDER_BIN" --background --factory-startup --disable-autoexec "$out/Atlas-Material-Offline.blend" --python-exit-code 1 --python scripts/art-learn-material-library.py -- reopen "$out/Atlas-Material-Offline.blend" "$out/Atlas-Material-Collection.blend" "$p/Atlas-Editorial-Collection.blend" 2>&1 | tee "$out/reopen.log"
      - name: Verify candidate evidence and no publication authorization
        run: |
          python3 - <<'PY'
          import json,os,pathlib,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"material-evidence"
          r=json.loads((p/"material-study.json").read_text())
          assert r["status"]=="PASS_MATERIAL_CANDIDATES" and r["sourceUnchanged"]
          assert len(r["assets"])==4 and len(r["maps"])==16 and len(r["renders"])==11
          assert all(v["geometryEqual"] for v in r["assets"].values())
          assert all(not r[k] for k in ("artisticApproval","webglQualified","publishable","studentAuthorized"))
          assert all(hashlib.sha256((p/(k+".png")).read_bytes()).hexdigest()==v["sha256"] for k,v in r["renders"].items())
          assert json.loads((p/"offline-reopen.json").read_text())["sourceUnavailable"]
          print("ART-LEARN-05D CANDIDATES ONLY: artist review required")
          PY
      - name: Preserve comparative images, models and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-art-learn-05d-material
          path: ${{ runner.temp }}/material-evidence/
          retention-days: 7
          if-no-files-found: warn
