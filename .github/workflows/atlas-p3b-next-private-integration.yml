name: ATLAS P3B — Integrazione Next privata, quattro destinazioni
on:
  push:
    branches: [work/atlas-artdir02-p2-composizioni-01]
    paths:
      - "src/app/gateway/p3b/**"
      - "src/features/atlas-gateway/p3b-private-*"
      - "scripts/atlas-gateway-production/p3b-private-viewer.html"
      - "scripts/atlas-gateway-production/p3b_next_integration_probe.mjs"
      - "next.config.ts"
      - ".github/workflows/atlas-p3b-next-private-integration.yml"
  pull_request:
    branches: [work/atlas-artdir02-p1f-pavilion-01]
    paths:
      - "src/app/gateway/p3b/**"
      - "src/features/atlas-gateway/p3b-private-*"
      - "scripts/atlas-gateway-production/p3b-private-viewer.html"
      - "scripts/atlas-gateway-production/p3b_next_integration_probe.mjs"
      - "next.config.ts"
      - ".github/workflows/atlas-p3b-next-private-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-p3b-next-private-${{ github.ref }}
  cancel-in-progress: true
jobs:
  p3b-next-real-app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install repository dependencies and verify types
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          test ! -e public/atlas-p3b-preview
      - name: Fetch exact authenticated P3B/R2 real GLB
        uses: actions/download-artifact@v4
        with:
          run-id: 45163398316
          pattern: atlas-p3b-four-levels-circular-oculus-2
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p3b
      - name: Verify P3A provenance, GLB and route policy
        run: |
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"p3b"
          r=json.loads((p/"atlas-p3b-webgl-receipt.json").read_text())
          f=p/"atlas-p3b-atrio-4-livelli-oculo-circolare.glb"
          assert r["schema"]=="atlas.gateway.p3b-four-gallery-webgl/v1"
          assert r["input_p3a_r2_sha256"]=="35371d226c289bd348a1137f63bfd14c74ee79389c4c1b53b522759ca0246d30"
          assert r["gallery_levels_including_ground"]==4 and r["circular_oculus_radius_bu"]==6.25
          assert r["third_gallery_railing_nodes"]==32 and len(r["suppressed_misplaced_decorations"])==2
          assert hashlib.sha256(f.read_bytes()).hexdigest()=="04b22de9d6c8f4e98a4eb88bf2f0e87141f9bdc685b742589845f977249e7adb"
          assert r["no_deploy"] and r["no_merge"] and not r["student_publication_approved"]
          print("ATLAS_P3B_NEXT_PRIVATE_AUTHENTIC_SOURCE_PASS")
          PY
      - name: Stage WebGL only in the temporary private Next.js test runner
        run: |
          mkdir -p public/atlas-p3b-preview
          npm pack three@0.128.0 --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent
          tar -xOf "$RUNNER_TEMP/three-0.128.0.tgz" package/build/three.min.js > public/atlas-p3b-preview/three.min.js
          tar -xOf "$RUNNER_TEMP/three-0.128.0.tgz" package/examples/js/loaders/GLTFLoader.js > public/atlas-p3b-preview/GLTFLoader.js
          tar -xOf "$RUNNER_TEMP/three-0.128.0.tgz" package/LICENSE > public/atlas-p3b-preview/THREE-LICENSE.txt
          test "$(git hash-object public/atlas-p3b-preview/three.min.js)" = b14f47c0908bab15e890b468d53bb07db0be3a18
          test "$(git hash-object public/atlas-p3b-preview/GLTFLoader.js)" = cfa518ede1b0893f1da14347d78fcd19355f3686
          cp scripts/atlas-gateway-production/p3b-private-viewer.html public/atlas-p3b-preview/index.html
          cp "$RUNNER_TEMP/p3b/atlas-p3b-atrio-4-livelli-oculo-circolare.glb" public/atlas-p3b-preview/
          cp "$RUNNER_TEMP/p3b/atlas-p3b-webgl-receipt.json" public/atlas-p3b-preview/
      - name: Install actual Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Qualify real Next application route, 3D transition and accessible fallback
        env:
          ATLAS_P3B_NEXT_EVIDENCE: ${{ runner.temp }}/p3b-next-evidence
          ATLAS_P3B_NEXT_URL: http://127.0.0.1:3000/gateway/p3b/
        run: |
          set -euo pipefail
          export ATLAS_P3B_PRIVATE_PREVIEW=true
          pnpm dev --hostname 127.0.0.1 --port 3000 >"$RUNNER_TEMP/p3b-next-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; rm -rf public/atlas-p3b-preview' EXIT
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          node scripts/atlas-gateway-production/p3b_next_integration_probe.mjs
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          rm -rf public/atlas-p3b-preview
          unset ATLAS_P3B_PRIVATE_PREVIEW
          pnpm dev --hostname 127.0.0.1 --port 3001 >"$RUNNER_TEMP/p3b-next-disabled.log" 2>&1 &
          PID=$!
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then break; fi
            sleep 2
          done
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/gateway/p3b/)
          test "$STATUS" = "404"
          echo "ATLAS_P3B_PRIVATE_ROUTE_DISABLED_BY_DEFAULT_PASS"
      - name: Preserve evidence, never public assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-p3b-next-private-integration-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/p3b-next-evidence/
            ${{ runner.temp }}/p3b-next-server.log
            ${{ runner.temp }}/p3b-next-disabled.log
          if-no-files-found: warn
          retention-days: 30
# NO deployment, no student data, and public asset staging is temporary only.
