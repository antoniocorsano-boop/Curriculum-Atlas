name: TRAMA TERM-01 Curricolo Vocabulary

on:
  pull_request:

permissions:
  contents: read

jobs:
  vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Vocabulary guard tests
        run: node scripts/test-curricolo-vocabulary-guard.mjs

      - name: Validate curricolo vocabulary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-curricolo-vocabulary.mjs "$BASE_SHA" "$HEAD_SHA"
