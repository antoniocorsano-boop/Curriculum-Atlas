name: FREE-DEPLOY — Cloudflare read-only preflight
on:
  pull_request:
    paths:
      - scripts/free-deploy-cloudflare-preflight.mjs
      - scripts/free-deploy-cloudflare-preflight.test.mjs
      - .github/workflows/free-deploy-cloudflare-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scripts/free-deploy-cloudflare-preflight.test.mjs
  preflight:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'antoniocorsano-boop/Curriculum-Atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: atlas-pr-preview
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Read metadata of the existing synthetic project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/free-deploy-cloudflare-preflight.mjs --read-only
# No deployment, no write API, no secrets on pull_request.
# Existing environment reuse is conditional on separately authorized invocation.
