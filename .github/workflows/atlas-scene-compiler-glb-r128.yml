name: Atlas — ASC-01 P2C2 GLB r128
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/atlas-scene-compiler-glb-preview.js'
      - 'scripts/test-atlas-scene-compiler-glb-r128.mjs'
      - 'docs/atlas-gateway/ASC-01-P2C2-GLB-R128.md'
      - '.github/workflows/atlas-scene-compiler-glb-r128.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-asc-p2c2-glb-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  r128-glb:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'work/atlas-production-standard-p2c2-glb' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ATLAS_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify source and install existing dependencies
        run: |
          node --check scripts/atlas-scene-compiler-glb-preview.js
          node --check scripts/test-atlas-scene-compiler-glb-r128.mjs
          pnpm install --frozen-lockfile
      - name: Recover exact P2C1 GLB and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-glb-r128-input"
          mkdir -p "$p" "$RUNNER_TEMP/asc-glb-r128-evidence"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14614203407/zip" -o "$p/source.zip"
          printf '%s  %s\n' ca2603da6ce05cecb546550651aa09babb96ad8a5c799702f0e9af242d2492e7 "$p/source.zip" | sha256sum --strict --check
          unzip -p "$p/source.zip" single-surface-baked.glb > "$p/baked.glb"
          unzip -p "$p/source.zip" light-transfer.json > "$p/light-transfer.json"
          printf '%s  %s\n' 442791262d07bb48bb51800d89a149046067047163d117a04d4fad3395e2a856 "$p/baked.glb" | sha256sum --strict --check
          chmod a-w "$p/baked.glb" "$p/light-transfer.json"
      - name: Prepare the existing pinned Three r128
        run: node scripts/build-atlas-gateway-local.mjs "$RUNNER_TEMP/asc-glb-r128-engine"
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Decode and inspect actual GLB under strict CSP
        run: |
          set -euo pipefail
          node scripts/test-atlas-scene-compiler-glb-r128.mjs "$RUNNER_TEMP/asc-glb-r128-input/baked.glb" "$RUNNER_TEMP/asc-glb-r128-input/light-transfer.json" "$RUNNER_TEMP/asc-glb-r128-engine" "$RUNNER_TEMP/asc-glb-r128-evidence"
      - name: Verify receipt and images
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"asc-glb-r128-evidence"
          r=json.loads((p/"glb-browser.json").read_text())
          assert r["status"]=="PASS_R128_GLB_UNLIT_TRANSFER" and r["revision"]==os.environ["ATLAS_EXACT_HEAD"]
          assert r["glbSha256"]=="442791262d07bb48bb51800d89a149046067047163d117a04d4fad3395e2a856"
          assert r["r128BrowserQualified"] and not r["fullLibraryQualified"] and r["browser"]["material"]=="MeshBasicMaterial"
          assert r["browser"]["lightInvariance"]["changed"]==0 and r["browser"]["highLightInvariance"]["changed"]==0
          assert r["browser"]["uvDifferent"]>0 and r["viewport"]["rollbackPixelsEqual"]
          assert not (r["externalRequests"] or r["pageErrors"] or r["consoleErrors"] or r["cspViolations"])
          assert not any(r[k] for k in ("studentAuthorized","publishable","artisticApproval","physicalDeviceQualified","runtimeModified","masterModified"))
          assert set(r["screenshots"])=={"reference","rotated","restored","mobile"}
          for name,x in r["screenshots"].items():
              blob=(p/(name+".png")).read_bytes()
              assert x["sha256"]==hashlib.sha256(blob).hexdigest() and x["bytes"]==len(blob)
          assert r["screenshots"]["reference"]["sha256"]==r["screenshots"]["restored"]["sha256"]!=r["screenshots"]["rotated"]["sha256"]
          print("ASC-P2C2 GLB UV2 unlit compatibility in r128 qualified, but not full library.")
          PY
      - name: Preserve fixture evidence, no deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-asc-p2c2-glb-r128
          path: ${{ runner.temp }}/asc-glb-r128-evidence/
          retention-days: 7
          if-no-files-found: warn
