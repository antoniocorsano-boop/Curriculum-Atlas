name: SMART Percorsi Binding Resolver
on:
  pull_request:
    paths:
      - 'docs/contracts/SMART-PERCORSI-BINDING-RESOLVER-01.md'
      - 'governance/smart-percorsi-binding-registry.json'
      - 'schemas/smart-percorsi-binding-registry.schema.json'
      - 'scripts/smart-percorsi-binding-resolver.mjs'
      - 'scripts/build-smart-percorsi-handoff-from-registry.mjs'
      - 'scripts/test-smart-percorsi-binding-resolver.mjs'
      - '.github/workflows/smart-percorsi-binding-resolver.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run resolver and canonical-registry adversarial tests
        run: node scripts/test-smart-percorsi-binding-resolver.mjs
      - name: Assert production registry has no bindings in this tranche
        run: node -e "const r=JSON.parse(require('fs').readFileSync('governance/smart-percorsi-binding-registry.json','utf8')); if(r.bindings.length!==0) process.exit(1); console.log('NO_ACTIVE_BINDINGS: PASS')"
