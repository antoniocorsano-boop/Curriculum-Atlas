name: Atlas Preview — Netlify stable URL

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "GitHub Actions run containing the validated atlas-pr-preview artifact"
        required: true
      exact_head:
        description: "Exact candidate SHA bound to the artifact"
        required: true

permissions:
  actions: read
  contents: read

env:
  NETLIFY_SITE_ID: 7ee88635-ac0d-4515-8cdf-7ae99b3023c6

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: atlas-pr-preview
    steps:
      - name: Download validated exact-head artifact
        uses: actions/download-artifact@v5
        with:
          name: atlas-pr-preview-${{ inputs.exact_head }}
          path: preview
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact-head binding and authorization boundary
        shell: bash
        run: |
          test -f preview/EXACT_HEAD.txt
          test "$(tr -d '\r\n' < preview/EXACT_HEAD.txt)" = "${{ inputs.exact_head }}"
          test -f preview/PREVIEW-MANIFEST.json
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('preview/PREVIEW-MANIFEST.json','utf8')); if(m.exactHead!=='${{ inputs.exact_head }}'||m.channel!=='artifact-only'||m.studentAuthorized!==false) process.exit(1);"

      - name: Deploy validated candidate to stable Atlas Preview site
        id: deploy
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=preview \
            --site="$NETLIFY_SITE_ID" \
            --message="Atlas Preview exact-head ${{ inputs.exact_head }} — NOT_RUNTIME_AUTHORIZED" \
            --json > netlify-deploy.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('netlify-deploy.json','utf8')); const u=d.url||d.deploy_url; if(!u) process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'url='+u+'\n');"

      - name: Record stable preview URL
        shell: bash
        run: |
          echo "### Atlas Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact head: \`${{ inputs.exact_head }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Student authorized: **false**" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable preview URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

# `--prod` means production deployment only for the dedicated atlas-pr-preview Netlify site.
# It does not publish canonical Atlas, merge the candidate, or authorize student use.
