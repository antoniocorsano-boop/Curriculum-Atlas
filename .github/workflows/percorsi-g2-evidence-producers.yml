name: Percorsi G2 Evidence Producers
on:
  pull_request:
    paths:
      - 'schemas/percorsi-g2-evidence-producer-result.schema.json'
      - 'scripts/percorsi-g2-evidence-producers.mjs'
      - 'scripts/test-percorsi-g2-evidence-producers.mjs'
      - 'scripts/test-percorsi-g2-q2-q3-q7-producers.mjs'
      - 'scripts/run-percorsi-rrt04-qualification.mjs'
      - 'evidence/percorsi-runtime/rrt04-inputs-2026-10-03.json'
      - 'scripts/validate-percorsi-g2-evidence-producer-schema.mjs'
      - 'scripts/percorsi-g2-invalidation.mjs'
      - 'scripts/test-percorsi-g2-invalidation.mjs'
      - 'scripts/qualify-percorsi-g2-audit.mjs'
      - 'scripts/test-percorsi-g2-audit-qualification.mjs'
      - 'scripts/validate-percorsi-g2-compliance-matrix.mjs'
      - 'governance/percorsi-g2-q5-q6-q1-compliance-matrix.json'
      - 'docs/TRAMA-CONTRACT-MATERIALIZATION-GOVERNANCE.md'
      - '.github/workflows/percorsi-g2-evidence-producers.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run governed Q5 Q6 Q1 producer tests
        run: node scripts/test-percorsi-g2-evidence-producers.mjs
      - name: Run governed Q2 Q3 Q7 producer tests
        run: node scripts/test-percorsi-g2-q2-q3-q7-producers.mjs
      - name: Run invalidation and revalidation tests
        run: node scripts/test-percorsi-g2-invalidation.mjs
      - name: Test fail-closed audit qualification
        run: node scripts/test-percorsi-g2-audit-qualification.mjs
      - name: Create isolated schema-validator lockfile
        run: |
          rm -rf .percorsi-g2-audit
          mkdir .percorsi-g2-audit
          printf '%s\n' '{"name":"percorsi-g2-audit","version":"1.0.0","private":true}' > .percorsi-g2-audit/package.json
          npm install --prefix .percorsi-g2-audit --package-lock-only --ignore-scripts ajv@8 ajv-formats@3
          test -s .percorsi-g2-audit/package-lock.json
      - name: Install isolated schema validator
        run: npm ci --prefix .percorsi-g2-audit --ignore-scripts
      - name: Enforce EvidenceProducerResult v1 on real producer outputs
        env:
          NODE_PATH: ${{ github.workspace }}/.percorsi-g2-audit/node_modules
        run: node scripts/validate-percorsi-g2-evidence-producer-schema.mjs
      - name: Capture isolated dependency audit evidence
        run: |
          set +e
          cd .percorsi-g2-audit
          npm audit --json > ../percorsi-g2-npm-audit.json
          audit_exit=$?
          set -e
          test -s ../percorsi-g2-npm-audit.json || { echo 'Audit evidence missing'; exit 1; }
          node -e "JSON.parse(require('fs').readFileSync('../percorsi-g2-npm-audit.json','utf8'))" || { echo 'Audit evidence is not valid JSON'; exit 1; }
          echo "audit_exit=$audit_exit" >> "$GITHUB_ENV"
      - name: Qualify dependency audit evidence
        run: node scripts/qualify-percorsi-g2-audit.mjs percorsi-g2-npm-audit.json
      - name: Enforce compliance matrix review readiness
        run: node scripts/validate-percorsi-g2-compliance-matrix.mjs
