name: TRAMA Perceptible Write

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perceptible-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce TRAMA-PW-01
        env:
          TRAMA_PW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TRAMA_PW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/trama-perceptible-write/validate.mjs
