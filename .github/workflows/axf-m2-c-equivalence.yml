name: AXF-M2-C Equivalent world
on:
  pull_request:
    paths:
      - 'labs/axf-m2/**'
      - '.github/workflows/axf-m2-c-equivalence.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: GDevelopApp/GDevelop-examples
          ref: a40f1279fdc6c7b8dd902691aee85630a17568d7
          path: official-example
          persist-credentials: false
          sparse-checkout: |
            examples/starting-point-and-click-adventure
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate equivalent authoring sources
        run: |
          mkdir -p evidence preview/phaser/vendor harness editor
          sudo apt-get update -q
          sudo apt-get install -y tiled xvfb python3-pil fonts-dejavu-core libnss3 libasound2t64 libgbm1 libgtk-3-0 libxss1 libatk-bridge2.0-0 libdrm2 libxkbcommon0
          cp labs/axf-m2/comparison/{index.html,host.mjs,model.mjs} preview/
          cp labs/axf-m2/comparison/{frame.html,phaser.mjs} preview/phaser/
          xvfb-run -a tiled --export-map json labs/axf-m2/world.tmx preview/phaser/world.json
          /usr/bin/python3 labs/axf-m2/comparison/build.py preview/phaser official-example/examples/starting-point-and-click-adventure/starting-point-and-click-adventure.json candidate
          cp -a candidate/assets preview/phaser/
          sha256sum candidate/assets/*.png | tee evidence/assets.sha256
          sha256sum preview/model.mjs | tee evidence/model.sha256
          diff -r candidate/assets preview/phaser/assets
          cp candidate/atelier.json evidence/
      - name: Local GDevelop export
        run: |
          curl -fL --retry 2 --max-time 180 https://github.com/4ian/GDevelop/releases/download/v5.6.285/GDevelop-5-5.6.285-linux.zip -o editor.zip
          echo "4728cf6df5c30aab0c8b211875c0a0a9c6d026da8781a28a389cafe6f3266839  editor.zip" | sha256sum -c -
          unzip -q editor.zip -d editor
          find editor -type f \( -name gdevelop -o -name GDevelop \) -print | head -1 > executable.txt
          test -s executable.txt
          chmod +x "$(cat executable.txt)"
          start=$(date +%s)
          timeout 300 xvfb-run -a "$(cat executable.txt)" --no-sandbox --disable-update-check --run-command EXPORT_HTML5_EXTERNAL "$PWD/candidate/atelier.json" 2>&1 | tee evidence/export.log
          echo $(($(date +%s)-start)) > evidence/gdevelop-export-seconds.txt
          test -s candidate/build/index.html
          grep -R -E -l --include="code*.js" "enableMetrics\([^;]*false" candidate/build | tee evidence/compiled-optout.txt
          test -s evidence/compiled-optout.txt
          mv candidate/build preview/gdevelop
      - name: Install pinned Phaser and browser harness
        working-directory: harness
        run: |
          npm init -y >/dev/null
          npm install --save-exact --ignore-scripts --no-audit --no-fund phaser@4.2.1 eventemitter3@5.0.4 playwright@1.56.1
          npm audit --omit=dev
          cp node_modules/phaser/dist/phaser.esm.min.js ../preview/phaser/vendor/phaser.esm.js
          echo "f4c5fd140d118c10fa9090641a03c17303bab9bfdc28e0626296777db1bb1bde  ../preview/phaser/vendor/phaser.esm.js" | sha256sum -c -
          npx playwright install --with-deps chromium
          cp ../labs/axf-m2/comparison/test.mjs .
      - name: Compare real exported scenes, semantics and privacy
        run: |
          du -sb preview/phaser preview/gdevelop | tee evidence/renderer-bytes.txt
          python3 -m http.server 8765 --bind 127.0.0.1 --directory preview >/tmp/axf-m2-c.log 2>&1 &
          node harness/test.mjs
      - name: M2-D single-source authoring change and regenerate both candidates
        run: |
          mkdir -p evidence/variant variant/phaser/vendor
          cp labs/axf-m2/comparison/{index.html,host.mjs,model.mjs} variant/
          cp labs/axf-m2/comparison/{frame.html,phaser.mjs} variant/phaser/
          cp preview/phaser/vendor/phaser.esm.js variant/phaser/vendor/
          /usr/bin/python3 labs/axf-m2/comparison/authoring-change.py labs/axf-m2/world.tmx variant/world.tmx | tee evidence/variant/change.json
          start=$(date +%s%N)
          xvfb-run -a tiled --export-map json variant/world.tmx variant/phaser/world.json
          echo $((($(date +%s%N)-start)/1000000)) > evidence/variant/tiled-export-ms.txt
          start=$(date +%s%N)
          /usr/bin/python3 labs/axf-m2/comparison/build.py variant/phaser official-example/examples/starting-point-and-click-adventure/starting-point-and-click-adventure.json variant-candidate
          echo $((($(date +%s%N)-start)/1000000)) > evidence/variant/generator-ms.txt
          cp -a variant-candidate/assets variant/phaser/
          diff -r candidate/assets variant-candidate/assets
          cmp preview/model.mjs variant/model.mjs
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('preview/phaser/world.json').read_text())
          b=json.loads(Path('variant/phaser/world.json').read_text())
          def objects(m): return {o['name']:o for l in m['layers'] for o in l['objects']}
          x=objects(a); y=objects(b)
          assert x.keys()==y.keys()
          assert x['quaderno']['y']==42 and y['quaderno']['y']==170
          x['quaderno']['y']=170
          assert x==y
          a=json.loads(Path('candidate/atelier.json').read_text())
          b=json.loads(Path('variant-candidate/atelier.json').read_text())
          obj=next(o for o in a['layouts'][0]['instances'] if o['name']=='quaderno')
          assert obj['y']==42
          obj['y']=170
          assert a==b
          print('PASS: only one native instance coordinate changed; assets and actions unchanged')
          PY
          start=$(date +%s%N)
          timeout 300 xvfb-run -a "$(cat executable.txt)" --no-sandbox --disable-update-check --run-command EXPORT_HTML5_EXTERNAL "$PWD/variant-candidate/atelier.json" 2>&1 | tee evidence/variant/export.log
          echo $((($(date +%s%N)-start)/1000000)) > evidence/variant/gdevelop-export-ms.txt
          test -s variant-candidate/build/index.html
          grep -R -E -l --include="code*.js" "enableMetrics\([^;]*false" variant-candidate/build | tee evidence/variant/compiled-optout.txt
          test -s evidence/variant/compiled-optout.txt
          mv variant-candidate/build variant/gdevelop
          cp variant-candidate/atelier.json evidence/variant/
          cp variant/phaser/world.json evidence/variant/
          python3 -m http.server 8767 --bind 127.0.0.1 --directory variant >/tmp/axf-m2-d.log 2>&1 &
          node harness/test.mjs --variant
      - uses: actions/checkout@v4
        with:
          ref: a7a8539f20336201f3a2c55f801ac2d7df5c16f4
          path: energy-source
          persist-credentials: false
          sparse-checkout: |
            labs/axf-energy
      - uses: actions/checkout@v4
        with:
          ref: abef350ea4b93730081bbea87d14ac33a0753747
          path: story-source
          persist-credentials: false
          sparse-checkout: |
            content/staging/biblioteca/poesia-energia
      - name: M3-A isolated mixed-renderer handoff and reference lock
        run: |
          mkdir -p evidence/m3-handoff mixed/energy/vendor mixed/assets
          cp labs/axf-m2/m3-handoff/{index.html,handoff.mjs} mixed/
          cp energy-source/labs/axf-energy/{scene.mjs,model.mjs} mixed/energy/
          cmp preview/model.mjs mixed/energy/model.mjs
          cp preview/phaser/vendor/phaser.esm.js mixed/energy/vendor/
          cp -a preview/gdevelop mixed/
          cp story-source/content/staging/biblioteca/poesia-energia/PE-0{1,3,4}.webp mixed/assets/
          (cd mixed/assets && printf '%s\n' 'e8dadbe7b10ea163c6f2e5941f25edcfb3093d3425d171cc29fdd7b7153e5865  PE-01.webp' '66fd334582294901b99712a096781ea620ad701bc2f2b81d0bee0c0f2b8187cf  PE-03.webp' '8f9db63137a76263e9af0280e9b64f0c3b499219832cd30bc6f38f67bf5195dc  PE-04.webp' | sha256sum -c) | tee evidence/m3-handoff/reference-lock.txt
          cp labs/axf-m2/m3-handoff/test.mjs harness/m3-test.mjs
          python3 -m http.server 8768 --bind 127.0.0.1 --directory mixed >/tmp/axf-m3.log 2>&1 &
          node harness/m3-test.mjs
      - name: Preserve diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axf-m2-c-evidence
          path: evidence/
          retention-days: 7
