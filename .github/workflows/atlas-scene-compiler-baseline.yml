name: Atlas — ASC-01 P1 source baseline
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/atlas-scene-compiler-baseline.py'
      - '.github/workflows/atlas-scene-compiler-baseline.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: atlas-asc-p1-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true
jobs:
  observe:
    if: github.event.repository.visibility == 'public' && github.event.pull_request.draft && github.event.pull_request.head.ref == 'work/atlas-production-standard-p1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ATLAS_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/atlas-blender-cache
          key: atlas-blender-linux-x64-v1-bea0eb3146be13eae6225409a117b215184f41b7f79e799f97cb3abb8f6dc404
      - name: Verify pinned Blender and syntax
        run: |
          bash scripts/atlas-gateway-c3/bootstrap-blender.sh
          python3 -m py_compile scripts/atlas-scene-compiler-baseline.py
      - name: Recover exact evidence archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-p1-input"
          mkdir -p "$p" "$RUNNER_TEMP/asc-p1-evidence"
          for spec in "14444143410 c7154de191cb6d25890a2881f470f6d6eeba74b2dcab897842f4753403e685c6 master" "14530010771 940568e08397d16a7d4445b5027ccdbb2b6f4534d0a16e239b2bef6c1707f0df art" "14504877437 fcee5c185fe98ac2f998d38553f649fbacf524616261be1c79823251847b3542 perf"; do
            read -r id sha name <<< "$spec"
            curl --fail --silent --show-error --location --retry 3 --max-time 180 --proto '=https' --proto-redir '=https' -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$p/$name.zip"
            printf '%s  %s\n' "$sha" "$p/$name.zip" | sha256sum --strict --check
          done
          python3 - <<'PY'
          import os,pathlib,zipfile,json,hashlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"asc-p1-input"
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"asc-p1-evidence"
          def member(z,name,limit):
              rows=[i for i in z.infolist() if pathlib.PurePosixPath(i.filename).name==name and not i.is_dir()]
              assert len(rows)==1 and rows[0].file_size<=limit,name
              return z.read(rows[0])
          with zipfile.ZipFile(p/"master.zip") as z:
              (p/"Atlas-Scene-Master.blend").write_bytes(member(z,"Atlas-Scene-Master.blend",20000000))
          with zipfile.ZipFile(p/"art.zip") as z:
              raw=member(z,"in-situ-study.json",2000000)
              (p/"in-situ-study.json").write_bytes(raw)
              r=json.loads(raw)
              names={v+"-"+m for v in ("atrium","detail","context") for m in ("baseline","candidate","restored")}
              assert set(r["renders"])==names
              for n in sorted(names):
                  b=member(z,n+".png",20000000)
                  assert hashlib.sha256(b).hexdigest()==r["renders"][n]["sha256"]
                  (out/(n+".png")).write_bytes(b)
          with zipfile.ZipFile(p/"perf.zip") as z:
              (p/"perf-geometry-probe.json").write_bytes(member(z,"perf-geometry-probe.json",2000000))
          PY
          printf '%s  %s\n' f216e3158c055de0990cd5f36ce388fe4731847fce12f2c42619b03806b9c3ab "$p/Atlas-Scene-Master.blend" | sha256sum --strict --check
          chmod a-w "$p/Atlas-Scene-Master.blend"
      - name: Observe exact master without modifications
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/asc-p1-input"
          "$BLENDER_BIN" --background --factory-startup --disable-autoexec "$p/Atlas-Scene-Master.blend" --python-exit-code 1 --python scripts/atlas-scene-compiler-baseline.py -- "$p/Atlas-Scene-Master.blend" "$p/in-situ-study.json" "$p/perf-geometry-probe.json" "$RUNNER_TEMP/asc-p1-evidence" 2>&1 | tee "$RUNNER_TEMP/asc-p1-evidence/run.log"
      - name: Validate observation receipt
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"asc-p1-evidence"
          r=json.loads((p/"asc-p1-baseline.json").read_text())
          assert r["status"]=="PASS_OBSERVATION_ONLY" and r["revision"]==os.environ["ATLAS_EXACT_HEAD"]
          assert r["masterUnchanged"] and r["masterBytesVerified"]
          assert len(r["bayMeshRanking"])==25 and sum(x["instances"] for x in r["bayMeshRanking"])==495
          assert len(list(p.glob("*.png")))==9 and len(r["pilotObjects"])>=7
          assert not any(r[k] for k in ("masterWrite","runtimeWrite","studentAuthorized","publishable","artisticApproval"))
          print("ASC-P1 inventory and art review packet verified; manual review still required.")
          PY
      - name: Preserve baseline and art review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-asc-p1-baseline
          path: ${{ runner.temp }}/asc-p1-evidence/
          retention-days: 7
          if-no-files-found: warn
