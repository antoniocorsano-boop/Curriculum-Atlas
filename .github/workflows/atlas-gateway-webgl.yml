name: Atlas Gateway — Local WebGL

on:
  pull_request:
    paths:
      - "src/features/atlas-gateway/**"
      - "src/app/gateway/**"
      - "src/app/esperienze/**"
      - "docs/atlas-gateway/**"
      - "scripts/*atlas-gateway*"
      - "scripts/atlas-gateway-integration/**"
      - "scripts/als01/**"
      - "package.json"
      - ".github/workflows/atlas-gateway-webgl.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  local-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install existing application dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify portal contract
        run: node --experimental-strip-types --test scripts/test-atlas-gateway-ag03.mjs
      - name: Recover exact R2 for integrated candidate only
        if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public' && github.event.pull_request.head.ref == 'work/atlas-gateway-r2-als01-integration' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atlas-r2"
          cd "$RUNNER_TEMP/atlas-r2"
          curl --fail --silent --show-error --location --max-time 120 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/14416938462/zip" -o r2.zip
          echo '84f1786ee98dac231f0d8fde0dd34bd1d1724f7ef707c1257b4fc824f3ade3ed  r2.zip' | sha256sum --strict --check
          unzip -p r2.zip four-stars.glb > four-stars.glb
          echo '684849b72dfc3314c6383e3a0864fa244145811f3d27fb9bdc76d7fbfd7f92e0  four-stars.glb' | sha256sum --strict --check
          echo "ATLAS_GATEWAY_R2_GLB=$RUNNER_TEMP/atlas-r2/four-stars.glb" >> "$GITHUB_ENV"
      - name: Prepare and verify local engine and styles
        run: |
          node scripts/build-atlas-gateway-local.mjs "$RUNNER_TEMP/atlas-gateway"
          echo "ATLAS_GATEWAY_SCENE_FILE=$RUNNER_TEMP/atlas-gateway/scene.html" >> "$GITHUB_ENV"
          echo "ATLAS_GATEWAY_SCENE_SHA256=$(sha256sum "$RUNNER_TEMP/atlas-gateway/scene.html" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "ATLAS_GATEWAY_EVIDENCE=$RUNNER_TEMP/atlas-gateway/evidence" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build local candidate
        env:
          ATLAS_GATEWAY_PREVIEW: "true"
        run: pnpm build
      - name: Start local candidate and verify real scene
        shell: bash
        env:
          ATLAS_GATEWAY_PREVIEW: "true"
        run: |
          set -euo pipefail
          pnpm start --hostname 127.0.0.1 > "$RUNNER_TEMP/atlas-gateway/server.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/gateway/ >/dev/null; then
              node scripts/test-atlas-gateway-webgl.mjs
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/atlas-gateway/server.log"
          exit 1
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-gateway-local-webgl
          path: |
            ${{ runner.temp }}/atlas-gateway/manifest.json
            ${{ runner.temp }}/atlas-gateway/*LICENSE.txt
            ${{ runner.temp }}/atlas-gateway/evidence/
            ${{ runner.temp }}/atlas-gateway/server.log
          if-no-files-found: ignore
          retention-days: 7

# Read-only qualification: no deployment, pages permissions or student authorization.
