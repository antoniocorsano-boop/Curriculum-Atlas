name: Experience Engine TDD

on:
  push:
    branches:
      - feat/atlas-experience-engine-v1

permissions:
  contents: read

jobs:
  contracts-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Experience contracts
        run: node scripts/test-experience-contracts.mjs
      - name: Experience grammar
        run: node scripts/test-experience-grammar-registry.mjs
      - name: Experience factory
        run: node scripts/test-experience-factory.mjs
      - name: Smart generality
        run: node scripts/test-experience-generality.mjs
      - name: Typecheck
        run: pnpm typecheck
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Experience runtime
        run: pnpm exec playwright test tests/experience-runtime.spec.ts --project=chromium
