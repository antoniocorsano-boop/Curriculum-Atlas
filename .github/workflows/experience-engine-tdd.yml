name: Experience Engine TDD

on:
  push:
    branches:
      - feat/atlas-experience-engine-v1

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Experience contracts
        run: node scripts/test-experience-contracts.mjs
