name: "ATLAS Atrium SEED-03 — Blender reale e tre viste"
# Revisione geometrica esperimentale: non abilita la pubblicazione e non approva ART-DIR-02.
on:
  push:
    branches: [work/atlas-gateway-01-foyer]
    paths:
      - ".github/workflows/atlas-atrium-seed-03-blender.yml"
      - "scripts/atlas-gateway-production/generate-atrium-seed-03.py"
      - "scripts/atlas-gateway-production/generate-atrium-seed.py"
      - "scripts/atlas-gateway-production/import-atrium-seed-03-blender.py"
      - "docs/atlas-gateway/ATLAS-ATRIUM-BLUEPRINT-03.json"
  pull_request:
    branches: [work/atlas-library-web-delivery]
    paths:
      - ".github/workflows/atlas-atrium-seed-03-blender.yml"
      - "scripts/atlas-gateway-production/generate-atrium-seed-03.py"
      - "scripts/atlas-gateway-production/generate-atrium-seed.py"
      - "scripts/atlas-gateway-production/import-atrium-seed-03-blender.py"
      - "docs/atlas-gateway/ATLAS-ATRIUM-BLUEPRINT-03.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-atrium-seed-03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-blender-seed03:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BLUEPRINT: "docs/atlas-gateway/ATLAS-ATRIUM-BLUEPRINT-03.json"
      EVIDENCE: "evidence/atlas-atrium-seed-03"
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: "Agg"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify exact versioned inputs
        run: |
          python -m py_compile scripts/atlas-gateway-production/generate-atrium-seed-03.py
          python -m py_compile scripts/atlas-gateway-production/import-atrium-seed-03-blender.py
          python -m json.tool "$BLUEPRINT" >/dev/null
          python - <<'PY'
          import json,os
          b=json.load(open(os.environ['BLUEPRINT']))
          assert b['id']=='ATLAS-ATRIUM-BLUEPRINT-03-EXPERIMENTAL'
          assert b['roof_gallery_design']['mode']=='rear_arcs_open_front_entry'
          assert [p['name'] for p in b['portals']]==['Curricolo','Esplora','Percorsi','Esperienze']
          assert set(b['cameras_R'])=={'CAM_HERO','CAM_SIDE','CAM_MOBILE'}
          assert b['reference']['canonical_file_in_production'] is False
          print("SEED-03 source checks PASS; canonical reference remains unavailable")
          PY
      - name: Install open-source geometry dependencies
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "trimesh>=4.3,<5" "matplotlib>=3.8,<4" "Pillow>=10,<13"
      - name: Build real SEED-03 GLB from repository source
        run: |
          mkdir -p "$EVIDENCE/geometry" "$EVIDENCE/blender"
          python scripts/atlas-gateway-production/generate-atrium-seed-03.py "$BLUEPRINT" "$EVIDENCE/geometry"
      - name: Verify GLB identity and four distinct portals
        run: |
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          p=Path(os.environ['EVIDENCE'])/'geometry'
          g=p/'ATLAS-ATRIUM-3D-SEED-03.glb'
          sha=hashlib.sha256(g.read_bytes()).hexdigest()
          data=json.loads((p/'ATLAS-ATRIUM-3D-SEED-03-evidence.json').read_text())
          # The SHA of an exported glTF can vary with the library build even
          # when its 3D topology is unchanged. Compare invariants and retain
          # both the current SHA and the historical SHA for traceability.
          historical_sha="7ac7ef7de6560ffa53f952df9634ca78037a6ba8b9e121a5d1a5b41c825f10ba"
          assert data['sha256']==sha,("EVIDENCE_SHA_MISMATCH",data.get('sha256'),sha)
          assert data['artifact']==g.name
          assert data['geometry_nodes']==308 and data['triangles']==62652
          (p/'sha-comparison.json').write_text(json.dumps({
            'current_glb_sha256':sha,'historical_glb_sha256':historical_sha,
            'binary_identity_to_historical':sha==historical_sha,
            'note':'Topology and roundtrip are the acceptance gate; GLB binary identity is diagnostic.'
          },indent=2)+'\n')
          print('HISTORICAL SHA SAME?',sha==historical_sha)
          assert data['structural_checks']['front_arrival_opening']
          assert data['structural_checks']['has_four_separate_portal_glazing_meshes']
          assert data['roundtrip']['valid']
          print("GLB SEED-03 VERIFIED",g.stat().st_size,sha)
          PY
      - name: Install Blender binary on Ubuntu runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends blender
          blender --version | head -3
      - name: Import actual GLB into Blender and produce .blend / three draft Cycles views
        run: |
          blender --background --factory-startup --threads 2 --python-exit-code 1 \
            --python scripts/atlas-gateway-production/import-atrium-seed-03-blender.py -- \
            --glb "$EVIDENCE/geometry/ATLAS-ATRIUM-3D-SEED-03.glb" \
            --blueprint "$BLUEPRINT" --output "$EVIDENCE/blender" --samples 6 --render
      - name: Validate actual Blender artifact and camera images
        run: |
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          from PIL import Image
          root=Path(os.environ['EVIDENCE'])/'blender'
          b=root/'atlas-atrium-3d-seed-03.blend'
          r=json.loads((root/'atlas-atrium-blender-evidence.json').read_text())
          assert b.exists() and b.stat().st_size>10000
          assert r['status']=='BLENDER_DRAFT_RENDERED'
          assert r['mesh_nodes_imported']>=300
          assert r['glb_sha256']==hashlib.sha256((Path(os.environ['EVIDENCE'])/'geometry'/'ATLAS-ATRIUM-3D-SEED-03.glb').read_bytes()).hexdigest()
          assert r['blueprint_sha256']==hashlib.sha256(Path(os.environ['BLUEPRINT']).read_bytes()).hexdigest()
          assert set(r['camera_names'])=={'CAM_HERO','CAM_SIDE','CAM_MOBILE'}
          assert r['production_quality']=='NOT_APPROVED_ART_DIR_02_REFERENCE_NOT_FITTED'
          for n in ['cam_hero.png','cam_side.png','cam_mobile.png']:
              p=root/n
              assert p.exists(),p
              im=Image.open(p);im.load()
              assert min(im.size)>=450
              assert any(hi-lo>8 for lo,hi in im.convert('RGB').getextrema()),n
              print(n,im.size,hashlib.sha256(p.read_bytes()).hexdigest())
          print('BLENDER CREATED',b.stat().st_size,hashlib.sha256(b.read_bytes()).hexdigest())
          PY
      - name: Preserve inputs, outputs and errors as GitHub Actions evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-atrium-seed-03-real-blender-${{ github.run_number }}
          path: evidence/atlas-atrium-seed-03/
          retention-days: 30
          if-no-files-found: warn
