name: Smart Publication Receipt Reconciliation

on:
  workflow_run:
    workflows:
      - Atlas Canonical Pages Deploy
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  reconcile:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
      RECEIPT_DIR: .smart-receipts/${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout deployed exact main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download SHA-bound Smart publication receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIR"
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --name "smart-publication-receipts-$DEPLOYED_SHA" \
            --dir "$RECEIPT_DIR"

      - name: Reconcile receipts into canonical MaterialSets
        id: reconcile
        run: |
          set -euo pipefail
          node scripts/reconcile-smart-publication-receipts.mjs \
            --receipt-dir "$RECEIPT_DIR" \
            --manifest-root content/smart-activities \
            --summary .smart-reconcile-summary.json

          changed="$(node -e "const s=require('./.smart-reconcile-summary.json'); process.stdout.write(String(s.changedManifests.length))")"
          rm -f .smart-reconcile-summary.json

          if [ "$changed" = "0" ]; then
            rm -rf "$RECEIPT_DIR"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Canonical Smart publication state is already equivalent; no PR required."
          else
            rm -rf "$RECEIPT_DIR"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_count=$changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft reconciliation PR
        if: steps.reconcile.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/smart-publication-receipts-$DEPLOYED_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add content/smart-activities
          git diff --cached --quiet && {
            echo "No canonical file changes remain after reconciliation; no PR required."
            exit 0
          }
          git commit -m "chore(atlas): reconcile Smart publication receipts"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            existing="$(gh pr list --repo "${{ github.repository }}" --head "$branch" --state open --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              echo "Draft reconciliation PR #$existing already exists for this deployed SHA; leaving it unchanged."
              exit 0
            fi
            echo "Receipt branch already exists without an open PR; refusing to overwrite it."
            exit 1
          fi

          git push origin "HEAD:$branch"

          printf -v body '%s\n\n%s\n\n%s\n' \
            "Canonical Atlas Pages verification produced matching Smart publication receipts for deployed SHA $DEPLOYED_SHA." \
            "This draft PR persists the first canonical proof for each resolved required asset and updates the existing MaterialSet readiness state. Equivalent later deploy receipts are intentionally ignored to prevent reconciliation loops." \
            "It creates no second readiness system, does not authorize runtime, and never merges automatically. Human review remains required."

          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$branch" \
            --draft \
            --title "Reconcile Smart publication receipts ($DEPLOYED_SHA)" \
            --body "$body"
