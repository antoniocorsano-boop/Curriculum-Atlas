name: ATLAS P3B — Anteprima privata quattro livelli, oculo circolare e accessi
on:
  push:
    branches: [work/atlas-artdir02-p2-composizioni-01]
    paths:
      - "scripts/atlas-gateway-production/p3b-private-viewer.html"
      - "scripts/atlas-gateway-production/p3b_browser_probe.mjs"
      - ".github/workflows/atlas-p3b-private-preview.yml"
  pull_request:
    branches: [work/atlas-artdir02-p1f-pavilion-01]
    paths:
      - "scripts/atlas-gateway-production/p3b-private-viewer.html"
      - "scripts/atlas-gateway-production/p3b_browser_probe.mjs"
      - ".github/workflows/atlas-p3b-private-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  p3b-private-webgl-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Recover exact P3B four-storey circular-roof GLB from qualified Blender export
        uses: actions/download-artifact@v4
        with:
          run-id: 45163398316
          pattern: atlas-p3b-four-levels-circular-oculus-2
          merge-multiple: true
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/p3b
      - name: Verify immutable real GLB and provenance
        run: |
          python3 - <<'PY'
          import hashlib,json,os,struct
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"p3b"
          report=json.loads((root/"atlas-p3b-webgl-receipt.json").read_text())
          f=root/"atlas-p3b-atrio-4-livelli-oculo-circolare.glb"
          assert f.stat().st_size==1973408
          assert hashlib.sha256(f.read_bytes()).hexdigest()=="04b22de9d6c8f4e98a4eb88bf2f0e87141f9bdc685b742589845f977249e7adb"
          assert struct.unpack("<III",f.read_bytes()[:12])==(0x46546c67,2,1973408)
          assert len(report["portals"])==4
          assert report["schema"]=="atlas.gateway.p3b-four-gallery-webgl/v1"
          assert report["gallery_levels_including_ground"]==4
          assert report["circular_oculus_radius_bu"]==6.25
          assert report["third_gallery_railing_nodes"]==32
          assert len(report["suppressed_misplaced_decorations"])==2
          assert not report["art_final_approved"] and not report["web_product_approved"]
          print("P3B_REAL_FOUR_STORY_GLB_SHA_VERIFIED")
          PY
      - name: Install application test runtime and local, pinned Three.js
        run: |
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/p3b-viewer"
          npm pack three@0.128.0 --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent
          tar -xOf "$RUNNER_TEMP/three-0.128.0.tgz" package/build/three.min.js > "$RUNNER_TEMP/p3b-viewer/three.min.js"
          tar -xOf "$RUNNER_TEMP/three-0.128.0.tgz" package/examples/js/loaders/GLTFLoader.js > "$RUNNER_TEMP/p3b-viewer/GLTFLoader.js"
          tar -xOf "$RUNNER_TEMP/three-0.128.0.tgz" package/LICENSE > "$RUNNER_TEMP/p3b-viewer/THREE-LICENSE.txt"
          test "$(git hash-object "$RUNNER_TEMP/p3b-viewer/three.min.js")" = b14f47c0908bab15e890b468d53bb07db0be3a18
          test "$(git hash-object "$RUNNER_TEMP/p3b-viewer/GLTFLoader.js")" = cfa518ede1b0893f1da14347d78fcd19355f3686
          test "$(git hash-object "$RUNNER_TEMP/p3b-viewer/THREE-LICENSE.txt")" = 5303437e406ed22d8cb0b4c12398870792a25878
          cp scripts/atlas-gateway-production/p3b-private-viewer.html "$RUNNER_TEMP/p3b-viewer/index.html"
          cp "$RUNNER_TEMP/p3b/atlas-p3b-atrio-4-livelli-oculo-circolare.glb" "$RUNNER_TEMP/p3b-viewer/"
          cp "$RUNNER_TEMP/p3b/atlas-p3b-webgl-receipt.json" "$RUNNER_TEMP/p3b-viewer/"
      - name: Install Chromium for actual 3D rendering
        run: pnpm exec playwright install --with-deps chromium
      - name: Serve local preview and verify desktop, smartphone, all four interactions
        env:
          ATLAS_P3B_EVIDENCE_DIR: ${{ runner.temp }}/p3b-browser
          ATLAS_P3B_PREVIEW_URL: http://127.0.0.1:8765/
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/p3b-viewer" >"$RUNNER_TEMP/p3b-server.log" 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/atlas-gateway-production/p3b_browser_probe.mjs
      - name: Preserve 3D preview and real-browser evidence (no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-p3b-private-preview-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/p3b-viewer/
            ${{ runner.temp }}/p3b-browser/
            ${{ runner.temp }}/p3b-server.log
          if-no-files-found: warn
          retention-days: 30
# No root URL change, publication permissions, or deploy.
