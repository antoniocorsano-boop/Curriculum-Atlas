<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' blob:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none';">
<title>Atlas P3B · Atrio a quattro livelli · Anteprima privata</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:system-ui,-apple-system,sans-serif;background:#07111d;color:#f7f1e7}
body{min-height:100svh;overflow:hidden}#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:manipulation}
#veil{pointer-events:none;position:fixed;inset:0;background:linear-gradient(180deg,rgba(5,10,19,.58),transparent 28%,transparent 65%,rgba(5,10,19,.78))}
header{position:fixed;top:0;left:0;right:0;padding:clamp(12px,2vw,28px);pointer-events:none}
header strong{display:block;font-size:clamp(16px,2vw,21px);letter-spacing:.15em;font-weight:550}
header p{margin:.5em 0 0;color:#d9cfbf;font-size:12px}
#progress{position:fixed;top:70px;left:clamp(12px,2vw,28px);font-size:13px;max-width:34em;color:#f0dfc4}
footer{position:fixed;bottom:0;width:100%;padding:16px 20px max(18px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(5,10,19,.93) 24%)}
footer nav{max-width:960px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:auto}
footer button{cursor:pointer;min-height:48px;border-radius:12px;border:1px solid rgba(225,189,129,.45);background:rgba(10,22,37,.76);color:#fff3db;font:500 14px system-ui,sans-serif;letter-spacing:.02em}
footer button:hover,footer button:focus-visible{outline:2px solid #ffe4a5;outline-offset:2px;background:#253b50}
footer .note{text-align:center;margin:12px 0 0;color:#b9bbbf;font-size:11px}
#selection{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);text-align:center;width:min(95vw,560px);padding:9px 12px;background:rgba(4,13,22,.88);border:1px solid #7c684b;border-radius:9px;font-size:13px;display:none}
#selection[data-visible=true]{display:block}
@media(max-width:620px){header strong{font-size:15px}footer{padding:10px 8px max(10px,env(safe-area-inset-bottom))}footer nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}footer button{min-height:46px}footer .note{font-size:10px}#selection{bottom:150px}header p{font-size:11px}}
html[data-embedded="true"] header,html[data-embedded="true"] footer,html[data-embedded="true"] #progress,html[data-embedded="true"] #selection{display:none!important}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Scena tridimensionale reale dell’atrio Atlas, con quattro portali selezionabili"></div>
<div id="veil" aria-hidden="true"></div>
<header><strong>ATLAS <span style="color:#e5c185;font-size:.75em">· Sala della conoscenza</span></strong><p>Prototipo 3D privato · Geometria P3A/R2 selezionata · Oculo circolare</p></header>
<p id="progress" role="status" aria-live="polite">Apertura dell'atrio tridimensionale…</p>
<div id="selection" role="status" aria-live="polite"></div>
<footer><nav aria-label="Quattro accessi di Atlas">
<button type="button" data-portal="curricolo">Curricolo</button>
<button type="button" data-portal="esplora">Esplora</button>
<button type="button" data-portal="percorsi">Percorsi</button>
<button type="button" data-portal="esperienze">Esperienze</button>
</nav><p class="note">Prova privata. Le destinazioni sono riconosciute, ma questa pagina isolata non le pubblica.</p></footer>
<script src="./three.min.js"></script>
<script src="./GLTFLoader.js"></script>
<script>
'use strict';
(()=>{
const PATHS=Object.freeze({curricolo:'/curricolo/',esplora:'/esplora/',percorsi:'/percorsi/',esperienze:'/esperienze/'});
const embedded=window.parent!==window;
const channel=new URLSearchParams(location.search).get('channel');
if(embedded)document.documentElement.dataset.embedded='true';
const stage=document.getElementById('stage'),progress=document.getElementById('progress'),selection=document.getElementById('selection');
const state={ready:false,error:null,glbBytes:null,triangles:0,selected:null,portalCount:0,renderer:null,camera:null,scene:null};
window.__ATLAS_P3B_PRIVATE_TEST__=state;
function show(id,origin){
  if(!(id in PATHS))return;
  state.selected=id;
  const path=PATHS[id];
  selection.dataset.visible='true';
  selection.textContent='Accesso '+id.charAt(0).toUpperCase()+id.slice(1)+' → '+path+' (destinazione locale verificata, non pubblicata da questa anteprima)';
  window.dispatchEvent(new CustomEvent('atlas-p3b-intent',{detail:{id,href:path,origin}}));
  if(embedded && /^[a-f0-9]{48}$/.test(channel||'')){
    window.parent.postMessage({type:'atlas-p3b-private-open',id,channel},location.origin);
  }
}
for(const b of document.querySelectorAll('button[data-portal]'))b.addEventListener('click',()=>show(b.dataset.portal,'tastiera-o-pulsante'));
try{
 if(!window.THREE||!THREE.GLTFLoader)throw Error('Motore 3D locale mancante');
 const r=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});
 r.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
 r.setClearColor(0x07111d,1);
 r.outputEncoding=THREE.sRGBEncoding;
 r.toneMapping=THREE.ACESFilmicToneMapping;
 r.toneMappingExposure=1.18;
 stage.appendChild(r.domElement);state.renderer=r;
 const loader=new THREE.GLTFLoader();
 loader.load('./atlas-p3b-atrio-4-livelli-oculo-circolare.glb',gltf=>{
   const scene=gltf.scene;
   scene.updateMatrixWorld(true);
   let camera=null;
   scene.traverse(o=>{if(o.isCamera && o.name.includes('P3A') && o.name.toUpperCase().includes('CAMERA'))camera=o;});
   if(!camera||!camera.isCamera)throw Error('Fotocamera autentica non trovata');
   state.scene=scene;state.camera=camera;
   scene.add(new THREE.HemisphereLight(0xc3dbff,0x293448,1.02));
   const sun=new THREE.DirectionalLight(0xe9e3d8,2.3);
   sun.position.set(3,12,6);
   scene.add(sun);
   const warm=new THREE.PointLight(0xffc17e,1.25,22);
   warm.position.set(-2,5,4);
   scene.add(warm);
   const targets=[];
   scene.traverse(obj=>{
      const id=obj.userData&&obj.userData.atlas_portal_id;
      if(obj.isMesh&&obj.userData.atlas_hit_target&&id in PATHS)targets.push(obj);
   });
   state.portalCount=targets.length;
   if(state.portalCount!==4)throw Error('La scena non contiene quattro pannelli selezionabili');
   const ray=new THREE.Raycaster();
   const pointer=new THREE.Vector2();
   function resize(){
      const w=window.innerWidth,h=window.innerHeight;
      r.setSize(w,h,false);
      if(camera.isPerspectiveCamera){
        const initial=camera.userData.atlasOriginalFov||(camera.userData.atlasOriginalFov=camera.fov);
        const originalAspect=16/9;
        const ratio=w/h;
        camera.aspect=ratio;
        camera.fov=ratio<originalAspect?Math.min(108,2*180/Math.PI*Math.atan(Math.tan(initial*Math.PI/360)*originalAspect/ratio)):initial;
        camera.updateProjectionMatrix();
      }
      r.render(scene,camera);
   }
   window.addEventListener('resize',resize,{passive:true});
   // A Next.js layout can resize the iframe after the GLB finishes loading.
   // Observe the actual drawing surface instead of relying only on window events.
   if(typeof ResizeObserver!=='undefined'){
     const watcher=new ResizeObserver(()=>resize());
     watcher.observe(stage);
   }
   r.domElement.addEventListener('pointerup',event=>{
      if(event.button!==0)return;
      const rect=r.domElement.getBoundingClientRect();
      pointer.x=(event.clientX-rect.left)/rect.width*2-1;
      pointer.y=-(event.clientY-rect.top)/rect.height*2+1;
      ray.setFromCamera(pointer,camera);
      const hit=ray.intersectObjects(targets,true)[0];
      if(hit){
        let object=hit.object;
        while(object&&!object.userData.atlas_portal_id)object=object.parent;
        if(object)show(object.userData.atlas_portal_id,'pannello-3d');
      }
   });
   resize();
   state.ready=true;
   progress.textContent='Atrio tridimensionale attivo · Seleziona uno dei quattro portali.';
 },undefined,err=>{state.error=String(err.message||err);progress.textContent='Scena 3D non disponibile: usa i quattro accessi testuali.';});
}catch(err){state.error=String(err.message||err);progress.textContent='Scena 3D non disponibile: usa i quattro accessi testuali.';}
})();
</script>
</body>
</html>
